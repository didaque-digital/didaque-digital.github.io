<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1830">
<title>Entrar na classe · Didaquê Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comum/app.css">
<style>
.app{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.hd{background:radial-gradient(70% 120% at 90% 0%,rgba(242,182,61,.4),transparent 70%),linear-gradient(135deg,var(--navy2),var(--acc));color:#fff;padding:24px 20px 52px}
.hd h1{margin:0 0 6px;font:700 clamp(28px,8vw,36px)/1.1 var(--serif)}
.hd p{margin:0;opacity:.92}
.box{position:relative;margin:-30px 14px 0;padding:20px 18px}
.box p{margin:6px 0;color:var(--ink)}
label{display:block;font-weight:700;margin:14px 0 6px}
label:first-child{margin-top:0}
input{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;background:#FFF8E6;color:var(--ink);-webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(27,79,156,.2)}
input.cod{text-transform:uppercase;letter-spacing:.22em;font:700 24px var(--serif);text-align:center}
.btn.o{background:var(--gold);color:#1B1203;box-shadow:0 8px 18px -8px rgba(232,154,43,.9)}
.btn:disabled{opacity:.6}
.msg{margin-top:12px;font-weight:700;color:#C62828}
.mut{color:var(--mut);font-size:15px}
</style>
</head>
<body>
<div class="app">
  <header class="top"><a href="../" aria-label="Página inicial"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg></a><b>Didaquê <i>Digital</i></b></header>
  <section class="hd"><h1>Entrar na classe</h1><p>Use o código que o seu instrutor te passou.</p></section>
  <main class="cd box" id="box">Carregando…</main>
</div>
<script type="module">
import { auth, db } from "../comum/fb.js";
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const $ = s => document.querySelector(s), box = $("#box");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const atual = () => { try { return JSON.parse(localStorage.getItem("didaque_aluno")); } catch (e) { return null; } };
// série da classe: "d" = Profecias de Daniel; qualquer outra coisa = Ouvindo a Voz de Deus
const destino = serie => serie === "d" ? "../daniel/estudos/" : "../estudos/";

function tela() {
  const a = atual();
  if (a && a.classe) {
    box.innerHTML = '<p>Você está na classe <b>' + esc(a.classe) + '</b> como <b>' + esc(a.nome) + '</b>.</p>' +
      '<a class="btn o" href="' + destino(a.serie) + '">Continuar os estudos</a>' +
      '<button class="btn g" id="trocar">Entrar em outra classe</button>';
    $("#trocar").onclick = () => { localStorage.removeItem("didaque_aluno"); tela(); };
    return;
  }
  box.innerHTML = '<label for="nome">Seu nome</label><input id="nome" autocomplete="given-name" maxlength="30">' +
    '<label for="cod">Código da classe</label><input id="cod" class="cod" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false">' +
    '<div id="m" class="msg"></div><button class="btn o" id="ok">Entrar</button>' +
    '<p class="mut" style="margin-bottom:0">Só pedimos o seu nome para o instrutor acompanhar o seu estudo.</p>';
  $("#ok").onclick = () => entrar();
  $("#cod").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
}

const slug = x => String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "aluno";

async function entrar(confirmado) {
  const nome = $("#nome").value.trim();
  const cod = $("#cod").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  const m = $("#m"), ok = $("#ok");
  if (!nome || cod.length < 4) { m.textContent = "Preencha o seu primeiro nome e o código da classe."; return; }
  ok.disabled = true; m.textContent = "";
  try {
    await auth.authStateReady();
    const u = auth.currentUser || (await signInAnonymously(auth)).user;
    const c = await getDoc(doc(db, "classes", cod));
    if (!c.exists()) { m.textContent = "Código não encontrado. Confira com o seu instrutor."; ok.disabled = false; return; }
    const serie = c.data().serie === "d" ? "d" : c.data().serie === "o" ? "o" : "";
    const id = slug(nome), ref = doc(db, "classes", cod, "alunos", id);
    const ex = await getDoc(ref);
    if (ex.exists() && confirmado !== true) {
      m.innerHTML = 'Já existe um aluno chamado <b>' + esc(nome) + '</b> nesta classe. É você voltando?' +
        '<div style="margin-top:8px"><button class="btn o" id="sim" style="margin-top:0">Sou eu, continuar</button>' +
        '<button class="btn g" id="nao">Não sou eu</button></div>';
      $("#sim").onclick = () => entrar(true);
      $("#nao").onclick = () => { m.textContent = "Use o primeiro nome e a inicial do sobrenome, por exemplo: João P."; ok.disabled = false; };
      return;
    }
    const dados = { nome: nome, uid: u.uid, atualizadoEm: serverTimestamp() };
    if (!ex.exists()) dados.entrouEm = serverTimestamp();
    await setDoc(ref, dados, { merge: true });
    localStorage.setItem("didaque_aluno", JSON.stringify({ classe: cod, nome: nome, id: id, serie: serie }));
    location.href = destino(serie);
  } catch (e) {
    console.error(e);
    m.textContent = "Não foi possível entrar. Verifique a internet e tente de novo. (" + (e.code || e.message) + ")";
    ok.disabled = false;
  }
}
tela();
</script>
</body>
</html>
