<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1830">
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
<title>Didaquê Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1830; --navy2:#12305A; --gold:#F2B63D; --gold2:#E89A2B; --cream:#F8EBCB; --ink:#12243F;
  --blue:#1B4F9C; --teal:#17747E; --line:rgba(255,255,255,.18);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--navy)}
body{margin:0;background:var(--navy);color:#fff;font:17px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,a{font:inherit;color:inherit;-webkit-touch-callout:none}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{display:block}
.app{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--navy) 0%,#0D2347 55%,var(--navy) 100%)}

/* Barra de cima */
.bar{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px}
.logo{font:700 26px/.95 var(--serif);letter-spacing:-.01em}
.logo b{display:block;color:var(--gold);font-weight:700;margin-left:22px}
.bar .sep{width:2px;height:38px;background:var(--gold);opacity:.8;border-radius:2px}
.bar .nm{flex:1;font-size:18px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.ico:active{background:rgba(255,255,255,.12)}

/* Destaque */
.hero{position:relative;padding:22px 18px 170px;overflow:hidden;
  background:radial-gradient(70% 90% at 82% 70%,rgba(242,182,61,.55),transparent 70%),linear-gradient(180deg,#0C2145,#143A6B)}
.hero.ban{padding:0;background:none}
.hero.ban img{display:block;width:100%;height:auto}
.hero.ban::after{height:18px}
.hero p{position:relative;z-index:1;margin:0;max-width:19em;font:600 clamp(19px,5.2vw,26px)/1.3 var(--serif)}
.hero svg.book{position:absolute;right:14px;bottom:20px;width:min(54%,230px);filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.hero::after{content:"";position:absolute;left:-12%;right:-12%;bottom:-2px;height:30px;background:var(--navy);
  border-top:2px solid var(--gold);border-radius:50% 50% 0 0/100% 100% 0 0}

.w{padding:0 16px}
h2{display:flex;align-items:center;gap:12px;margin:18px 0 14px;font:700 clamp(24px,6.4vw,30px)/1.1 var(--serif)}
h2::before{content:"";width:4px;height:30px;border-radius:2px;background:var(--gold)}

/* Séries */
.series{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{display:flex;flex-direction:column;background:var(--cream);color:var(--ink);border-radius:20px;overflow:hidden;
  border:1px solid rgba(242,182,61,.7);box-shadow:0 10px 22px -10px rgba(0,0,0,.6);transition:transform .12s}
.sc:active{transform:scale(.97)}
.sc[disabled]{cursor:default}.sc[disabled]:active{transform:none}
.art{height:112px;display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.a1{background:radial-gradient(circle at 50% 100%,#FFE9A8 0,#F2B63D 22%,#7A5A2A 55%,#2B4A2A 100%)}
.a2{background:linear-gradient(180deg,#3E6FB5 0%,#E9A24A 78%,#C97A2E 100%)}
.a3{background:radial-gradient(circle at 78% 6%,#FFC970 0,#3B6FB6 14%,#0E2347 55%,#050C1C 100%)}
.sc .t{padding:10px 8px 6px;text-align:center;font:700 clamp(15px,4.2vw,19px)/1.15 var(--serif);min-height:3.2em;display:grid;place-items:center}
.sc .m{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 8px;padding:7px 0;border-top:2px solid var(--gold);font-size:14px;font-weight:600}
.sc .go{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 8px 10px;padding:10px 4px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;line-height:1.1;text-align:center}
.sc[disabled] .go{background:#6B7280;color:#E5E7EB}

/* Entrar */
.acts{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
.act{position:relative;display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:22px;text-decoration:none;overflow:hidden;
  border:1px solid rgba(255,255,255,.25);box-shadow:0 12px 24px -12px rgba(0,0,0,.7);transition:transform .12s}
.act:active{transform:scale(.97)}
.act.al{background:linear-gradient(135deg,#1D5BB8,#0F3A7A)}
.act.in{background:linear-gradient(135deg,#1C8A8A,#0C5560)}
.act svg.p{flex:none;width:44px;height:44px}
.act div{flex:1;line-height:1.2}
.act b{display:block;font:700 clamp(19px,5vw,23px)/1.1 var(--serif);margin-bottom:3px}
.act span{font-size:14px;opacity:.92}
.act i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center}

.info{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04);font-size:15.5px}
.info svg{flex:none;width:30px;height:30px;color:var(--gold)}

.foot{margin-top:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;font-size:14px}
.foot .logo{font-size:21px}.foot .logo b{display:inline;margin:0 0 0 5px}
.foot .tg{flex:1;color:#C9D5E8;border-left:2px solid var(--gold);padding-left:12px;line-height:1.25}
.foot button{display:flex;align-items:center;gap:6px;color:#fff;min-height:44px;padding:0 6px;font-weight:600}
.foot button svg{width:22px;height:22px}

/* Folha de baixo */
.ov{position:fixed;inset:0;background:rgba(3,10,24,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0 auto;max-width:760px;background:var(--cream);color:var(--ink);
  border-radius:26px 26px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
.open .ov{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible}
.grip{width:46px;height:5px;border-radius:3px;background:rgba(18,36,63,.25);margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font:700 26px/1.15 var(--serif)}
.sheet .n{font-weight:700;color:#8A5A0E;margin-bottom:8px}
.sheet p{margin:0 0 18px;font-size:17.5px;line-height:1.5;-webkit-user-select:text;user-select:text}
.sheet .row{display:grid;gap:10px}
.sbtn{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:18px}
.sbtn.o{background:var(--gold2);color:#1B1203}
.sbtn.g{background:transparent;border:2px solid var(--ink);color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:560px){.acts{grid-template-columns:1fr 1fr}}
@media (max-width:370px){.series{gap:8px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6DC"/><stop offset="1" stop-color="#E9D29A"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE3A0" stop-opacity=".9"/><stop offset="1" stop-color="#F2B63D" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7FC4F2"/><stop offset=".6" stop-color="#2A64B4"/><stop offset="1" stop-color="#0E2A5C"/></radialGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7D277"/><stop offset="1" stop-color="#C98A25"/></linearGradient>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 6.2C10.4 5 8 4.5 3 4.5v13.2c5 0 7.4.6 9 1.8 1.6-1.2 4-1.8 9-1.8V4.5c-5 0-7.4.5-9 1.7zm-1 11.2c-1.7-.7-3.6-1-6-1.1V6.2c2.4.2 4.3.6 6 1.4zm8 0c-2.400.1-4.300.4-6 1.100V7.600c1.700-.8 3.600-1.200 6-1.400z"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path fill="currentColor" d="M7 3a3 3 0 0 0-3 3v1h2.500v10a3 3 0 0 0 3 3H18a2.500 2.500 0 0 0 2.500-2.500V17H9V6a3 3 0 0 0-.4-1.500H18A1.500 1.500 0 0 1 19.500 6v9H21V6a3 3 0 0 0-3-3zm4 6h6v1.500h-6zm0 3h6v1.500h-6z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.700-4-2.300z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.800"/><path fill="currentColor" d="M11 10.500h2V17h-2zm0-3.500h2v2h-2z"/></symbol>
    <symbol id="i-aluno" viewBox="0 0 48 48"><circle cx="24" cy="12" r="7" fill="#fff"/><path fill="#fff" d="M10 40V28c0-5 6-8 14-8s14 3 14 8v12z"/><path fill="#0F3A7A" d="M13 40V30c3-2 7-3 11-3s8 1 11 3v10l-11-2z"/><path fill="#fff" d="M24 31l-10-2v10l10 2 10-2V29z" opacity=".95"/><path stroke="#0F3A7A" stroke-width="1.500" d="M24 31v10"/></symbol>
    <symbol id="i-instrutor" viewBox="0 0 48 48"><circle cx="12" cy="14" r="6" fill="#fff"/><path fill="#fff" d="M3 38V27c0-4 4-6 9-6s9 2 9 6v11z"/><rect x="22" y="8" width="23" height="18" rx="2.500" fill="none" stroke="#fff" stroke-width="2.500"/><path stroke="#fff" stroke-width="2.500" stroke-linecap="round" d="M27 14h13M27 19h9M33 26l-4 11M37 26l4 11"/></symbol>
  </defs>
</svg>

<div class="app" id="app">

  <header class="bar">
    <div class="logo">Didaquê<b>Digital</b></div>
    <span class="sep" aria-hidden="true"></span>
    <span class="nm">Estudos bíblicos</span>
    <button class="ico" data-sheet="sobre" aria-label="Menu e informações"><svg width="30" height="30"><use href="#i-menu"/></svg></button>
  </header>

  <section class="hero ban">
    <img src="img/banner.png" alt="Didaquê Digital: estudos bíblicos guiados por instrutor direto no celular ou tablet">
  </section>

  <main class="w">
    <h2>Conheça as séries</h2>
    <div class="series">
      <button class="sc" data-sheet="o">
        <span class="art a1"><svg viewBox="0 0 100 80" aria-hidden="true"><g stroke="#FFF1C2" stroke-width="1.500" opacity=".5"><path d="M50 78L10 6M50 78L30 2M50 78L50 0M50 78L70 2M50 78L90 6"/></g><svg x="31" y="30" width="38" height="38" viewBox="0 0 24 24" style="color:#FFF6DC"><use href="#i-book"/></svg></svg><img src="img/ouvindo.jpg" alt="" onerror="this.remove()"></span>
        <span class="t">Ouvindo a Voz de Deus</span>
        <span class="m"><svg width="18" height="18"><use href="#i-book"/></svg>13 estudos</span>
        <span class="go">Conhecer a série <svg width="12" height="12"><use href="#i-chev"/></svg></span>
      </button>
      <button class="sc" data-sheet="d">
        <span class="art a2"><svg viewBox="0 0 100 80" aria-hidden="true"><path d="M0 80V66l9-6 8 6v14zM76 80V58l10-8 14 8v22z" fill="#8A4F1E" opacity=".55"/><path d="M43 18l2-8 5 4 5-4 2 8z" fill="url(#gd)"/><circle cx="50" cy="24" r="7" fill="url(#gd)"/><path d="M33 36q17-7 34 0l5 44H28z" fill="url(#gd)"/><rect x="35" y="46" width="30" height="10" rx="5" fill="#B77B1E"/><path d="M50 38v6" stroke="#8A5A10" stroke-width="2"/></svg><img src="img/daniel.jpg" alt="" onerror="this.remove()"></span>
        <span class="t">Daniel</span>
        <span class="m"><svg width="18" height="18"><use href="#i-book"/></svg>16 estudos</span>
        <span class="go">Conhecer a série <svg width="12" height="12"><use href="#i-chev"/></svg></span>
      </button>
      <button class="sc" disabled aria-label="Apocalipse, em breve">
        <span class="art a3"><svg viewBox="0 0 100 80" aria-hidden="true"><circle cx="50" cy="46" r="27" fill="url(#gb)"/><path d="M34 32c6-5 14-4 16 1 2 5-6 6-4 11 2 4 9 2 8 8-1 5-9 6-13 3-5-4-10-14-7-23zM58 44c5-2 11 2 10 8-1 5-7 8-11 5-3-3-3-11 1-13z" fill="#4FA464" opacity=".9"/><path d="M26 40a27 27 0 0 1 40-18" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></svg><img src="img/apocalipse.jpg" alt="" onerror="this.remove()"></span>
        <span class="t">Apocalipse</span>
        <span class="m"><svg width="18" height="18"><use href="#i-clock"/></svg>Em breve</span>
        <span class="go">Conhecer a série <svg width="12" height="12"><use href="#i-chev"/></svg></span>
      </button>
    </div>

    <nav class="acts" aria-label="Entrar">
      <a class="act al" href="entrar/">
        <svg class="p"><use href="#i-aluno"/></svg>
        <div><b>Sou aluno</b><span>Entrar com o código da classe</span></div>
        <i><svg width="18" height="18"><use href="#i-chev"/></svg></i>
      </a>
      <a class="act in" href="instrutor/">
        <svg class="p"><use href="#i-instrutor"/></svg>
        <div><b>Sou instrutor</b><span>Criar e acompanhar classes</span></div>
        <i><svg width="18" height="18"><use href="#i-chev"/></svg></i>
      </a>
    </nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="grip"></div>
  <h3 id="sh-t"></h3>
  <div class="n" id="sh-n"></div>
  <p id="sh-p"></p>
  <div class="row" id="sh-r"></div>
</div>

<script>
(function(){
  var S={
    o:{t:"Ouvindo a Voz de Deus",n:"13 estudos",p:"Os grandes temas da Bíblia, um de cada vez: da criação e do plano da salvação até a volta de Jesus, a vida cristã e o batismo.",b:1},
    d:{t:"Profecias de Daniel",n:"16 estudos",p:"Os sonhos e as visões de Daniel, e como eles se cumprem na história, apontando para Cristo e para o fim do grande conflito.",b:1},
    sobre:{t:"Sobre o Didaquê Digital",n:"Mateus 28:19-20",p:"“Didaquê” vem do grego e significa “ensino”. É a palavra por trás do mandato de Jesus: fazer discípulos, batizá-los e ensiná-los. Os estudos são conduzidos por um instrutor, e cada estudo concluído libera o próximo."}
  };
  var app=document.getElementById("app"),sh=document.getElementById("sheet"),last=null;
  function esc(s){return s}
  function abrir(k,el){
    var d=S[k]; last=el;
    document.getElementById("sh-t").textContent=d.t;
    document.getElementById("sh-n").textContent=d.n;
    document.getElementById("sh-p").textContent=d.p;
    var r=document.getElementById("sh-r");
    r.innerHTML=d.b?'<a class="sbtn" href="entrar/">Sou aluno: entrar com o código</a><a class="sbtn o" href="instrutor/">Sou instrutor</a><button class="sbtn g" data-x>Fechar</button>':'<button class="sbtn" data-x>Fechar</button>';
    document.body.classList.add("open");
    app.setAttribute("aria-hidden","true");
    setTimeout(function(){var f=r.querySelector("a,button");if(f)f.focus()},60);
  }
  function fechar(){
    document.body.classList.remove("open");
    app.removeAttribute("aria-hidden");
    if(last)last.focus();
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-sheet]");
    if(b){abrir(b.getAttribute("data-sheet"),b);return}
    if(e.target.closest("[data-x]")||e.target.id==="ov")fechar();
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.body.classList.contains("open"))fechar()});
})();
     <div class="info">
      <svg><use href="#i-info"/></svg>
      <span>As perguntas e atividades acontecem dentro de uma classe, com acompanhamento de um instrutor.</span>
    </div>
  </main>

</div>
</script>
</body>
</html>
