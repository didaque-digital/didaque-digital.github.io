<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel do instrutor · Didaquê Digital</title>
<style>
:root{--bg:#F6F4EF;--card:#fff;--tx:#1D2433;--mut:#5B6577;--line:#E4DFD3;--navy:#0C1A2E;--navy2:#16355A;--or:#E07B39;--teal:#2A7F8E;--ok:#2E7D32;--bad:#C62828;--inp:#FDF1D8;--gold:#F4B43C}
@media (prefers-color-scheme:dark){:root{--bg:#0A1424;--card:#13243D;--tx:#ECEFF4;--mut:#A8B3C6;--line:#25405F;--teal:#6CC6D3;--ok:#66BB6A;--bad:#EF5350;--inp:#1E3556}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Calibri,"Segoe UI",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:760px;margin:0 auto;padding:0 14px 50px}
.top{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;margin:0 -14px 16px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font:700 22px/1.15 Georgia,serif;margin:0}
.top small{display:block;opacity:.8;font-size:13px}
.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--or);border-radius:14px;padding:14px 16px;margin:10px 0}
h2{font:700 20px Georgia,serif;margin:18px 0 6px}
.btn{background:var(--or);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:700 16px inherit;cursor:pointer}
.btn.sec{background:transparent;color:var(--teal);border:2px solid var(--teal);padding:8px 14px;font-size:15px}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.sec.sm{padding:4px 10px;font-size:14px}
.btn.del{background:var(--bad)}
.btn.sec.perig{color:var(--bad);border-color:var(--bad)}
input,select{font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--inp);color:var(--tx);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:14px}
.msg{color:var(--bad);font-weight:700;margin-top:8px}
.code{font:700 34px/1 Georgia,serif;letter-spacing:.18em;color:var(--or)}
.alu{border-left-color:var(--teal)}
.alu.call{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.alu .nm{font:700 18px Georgia,serif}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--or)}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--inp);margin-right:4px}
.badge.red{background:var(--bad);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.q{border-top:1px solid var(--line);padding:8px 0}
.q.cur{background:color-mix(in srgb,var(--gold) 18%,transparent);border-radius:8px;padding:8px}
.esp{color:var(--bad);font-weight:700}
.stu{color:var(--tx)}
.tag{font-size:13px;color:var(--mut)}
.aviso{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-top:8px}
.gbtn{display:flex;align-items:center;width:100%;max-width:340px;padding:2px;border:0;border-radius:8px;background:#4285F4;color:#fff;cursor:pointer;font:600 17px Roboto,"Segoe UI",system-ui,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.gbtn:hover{background:#3b78e0}.gbtn:active{background:#3367d6}
.gbtn .gl{background:#fff;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px}
.gbtn .gt{flex:1;text-align:center;padding:0 12px}
a.link{color:var(--teal);cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
</style>
</head>
<body>
<div class="w">
  <header class="top"><div><h1>Painel do instrutor</h1><small id="who">Didaquê Digital</small></div><button id="sair" style="display:none">Sair</button></header>
  <main id="main"><div class="card">Carregando…</div></main>
</div>

<script type="module">
import { auth, db } from "../comum/fb.js";
import { GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { doc, getDoc, getDocs, setDoc, deleteDoc, writeBatch, collection, query, where, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const $ = s => document.querySelector(s), main = $("#main");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TITULOS = ["A Bíblia","Criação e origem do mal","O plano da salvação","A volta de Jesus","A morte e a Nova Terra","Santuário e juízo","A lei de Deus e o sábado","Princípios de saúde","O dom de profecia","Dízimo e ofertas","A igreja remanescente","Vida cristã e o Espírito Santo","Batismo e missão"];
// Número do administrador para o botão de WhatsApp (só dígitos, com 55 + DDD). Deixe "" para esconder o botão.
const ADMIN_WHATSAPP = "";
let user = null, unsubClasses = null, unsubAlunos = null, unsubSol = null, ehAdmin = false, aberto = {}, alunos = [], classeAtual = null;
// Estados de edição/confirmação (sobrevivem às atualizações ao vivo)
let editC = {}, delC = {}, editA = {}, remA = {};

/* ===== Dados dos estudos (lidos direto da página de cada estudo) ===== */
const cache = {};
async function carregarEstudo(n) {
  if (cache[n]) return cache[n];
  const r = await fetch("../estudo-" + n + "/", { cache: "no-store" });
  if (!r.ok) throw new Error("Estudo " + n + " não publicado");
  const t = await r.text();
  const a = t.indexOf("var Q = "), b = t.indexOf(";\nvar NQ", a);
  if (a < 0 || b < 0) throw new Error("Formato do estudo " + n + " não reconhecido");
  return (cache[n] = (new Function("return " + t.slice(a + 8, b)))());
}
function esperado(q) {
  const o = [];
  if (q.p) o.push(q.p.filter(x => typeof x !== "string").map(x => x[0]).join(" · "));
  if (q.i) o.push(q.i.map((x, k) => (k + 1) + ") " + (x[1] ? "V" : "F")).join("  "));
  if (q.o) o.push(q.o[q.c]);
  return o.join(" | ");
}
function respAluno(q, a) {
  if (!a) return "";
  const o = [];
  if (a.f) o.push(a.f.join(" · "));
  if (a.v && q.i) o.push(q.i.map((x, k) => (k + 1) + ") " + (a.v[k] === 1 ? "V" : a.v[k] === 0 ? "F" : "—")).join("  "));
  if (a.c !== undefined && q.o) o.push(q.o[a.c]);
  return o.join(" | ");
}
function totalErros(d, n) {
  const e = d.erros || {}; let s = 0;
  Object.keys(e).forEach(k => { if (k.indexOf("e" + n + "_") === 0) s += e[k]; });
  return s;
}
function quando(ts) {
  if (!ts || !ts.toDate) return "agora";
  const s = Math.round((Date.now() - ts.toDate().getTime()) / 1000);
  if (s < 60) return "agora há pouco";
  if (s < 3600) return "há " + Math.round(s / 60) + " min";
  if (s < 86400) return "há " + Math.round(s / 3600) + " h";
  return "há " + Math.round(s / 86400) + " dias";
}
function novoCodigo() {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = "";
  for (let i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}
function pararTudo() { if (unsubClasses) unsubClasses(); if (unsubAlunos) unsubAlunos(); if (unsubSol) unsubSol(); unsubClasses = unsubAlunos = unsubSol = null; }

/* ===== Login ===== */
$("#sair").onclick = async () => { pararTudo(); await signOut(auth); };
onAuthStateChanged(auth, async u => {
  pararTudo();
  if (u && u.isAnonymous) { await signOut(auth); return; }   // sessão de aluno neste aparelho
  user = u;
  $("#sair").style.display = u ? "" : "none";
  $("#who").textContent = u ? (u.displayName || u.email) : "Didaquê Digital";
  if (!u) return telaLogin();
  entrarPainel();
});

async function entrarPainel() {
  try {
    const d = await getDoc(doc(db, "instrutores", user.uid));
    ehAdmin = d.exists() && d.data().admin === true;
    if (d.exists()) telaClasses(); else telaConvite();
  } catch (e) { console.error(e); main.innerHTML = '<div class="card">Não foi possível carregar.<div class="mut">Detalhe técnico: ' + esc(e.code || e.message) + '</div></div>'; }
}

function telaLogin() {
  main.innerHTML = '<div class="card"><p>Entre com a sua conta Google para criar classes e acompanhar os alunos.</p><button class="gbtn" id="g" type="button"><span class="gl"><svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span><span class="gt">Entrar com o Google</span></button><div id="m" class="msg"></div>' +
    '<p class="mut">Dica: abra esta página no navegador (Chrome). Dentro de alguns aplicativos o login do Google não funciona.</p></div>';
  $("#g").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { console.error(e); $("#m").textContent = "Não foi possível entrar. Se a janela do Google foi bloqueada, permita pop-ups e tente de novo."; }
  };
}

async function telaConvite() {
  let sol = null;
  try { const x = await getDoc(doc(db, "solicitacoes", user.uid)); if (x.exists()) sol = x.data(); } catch (e) {}
  const wa = ADMIN_WHATSAPP ? ' <a class="btn sec" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/' + ADMIN_WHATSAPP + '?text=' + encodeURIComponent("Olá! Pedi acesso de instrutor no Didaquê Digital com o e-mail " + (user.email || "") + ". Pode aprovar?") + '">Avisar o administrador pelo WhatsApp</a>' : '';
  main.innerHTML = '<div class="card"><p style="margin-top:0"><b>Primeiro acesso.</b> Se você recebeu um código de convite de instrutor, digite aqui:</p><div class="row"><input id="cv" placeholder="Código de convite" autocomplete="off"><button class="btn" id="ok">Continuar</button></div><div id="m" class="msg"></div></div>' +
    '<div class="card"><p style="margin-top:0"><b>Não tem o código?</b> Peça acesso. O administrador vai analisar o seu pedido.</p>' +
    (sol && sol.status === "pendente"
      ? '<p class="mut">✔ Pedido enviado. Assim que for aprovado, toque em "Verificar de novo".</p><button class="btn sec" id="ver">Verificar de novo</button>'
      : '<button class="btn" id="pedir">Pedir acesso</button>') + wa + '<div id="m2" class="msg"></div></div>';
  $("#ok").onclick = async () => {
    const convite = $("#cv").value.trim();
    if (!convite) return;
    try {
      await setDoc(doc(db, "instrutores", user.uid), { nome: user.displayName || "", email: user.email || "", convite: convite, criadoEm: serverTimestamp() });
      entrarPainel();
    } catch (e) { console.error(e); $("#m").textContent = "Código de convite incorreto. (" + (e.code || e.message) + ")"; }
  };
  if ($("#ver")) $("#ver").onclick = entrarPainel;
  if ($("#pedir")) $("#pedir").onclick = async () => {
    try {
      await setDoc(doc(db, "solicitacoes", user.uid), { nome: user.displayName || "", email: user.email || "", status: "pendente", em: serverTimestamp() });
      telaConvite();
    } catch (e) { console.error(e); $("#m2").textContent = "Não foi possível enviar o pedido. (" + (e.code || e.message) + ")"; }
  };
}

/* ===== Lista de classes ===== */
function telaClasses() {
  pararTudo(); classeAtual = null; editC = {}; delC = {};
  main.innerHTML = '<div id="adm"></div><h2>Minhas classes</h2><div id="lista"></div><div id="mc" class="msg"></div>' +
    '<div class="card"><div class="row"><input id="nc" placeholder="Nome da nova classe (ex.: Turma de sábado)" style="flex:1;min-width:200px"><button class="btn" id="criar">Criar classe</button></div><div id="m" class="msg"></div></div>' +
    '<h2>Guia do instrutor</h2><div class="card"><p class="mut" style="margin-top:0">Veja todas as perguntas de um estudo com as respostas esperadas.</p><button class="btn sec" id="guia">Abrir o guia</button></div>';
  $("#guia").onclick = telaGuia;
  $("#criar").onclick = criarClasse;
  if (ehAdmin) pedidosAdmin();
  unsubClasses = onSnapshot(query(collection(db, "classes"), where("instrutorUid", "==", user.uid)), snap => {
    const L = $("#lista"); if (!L) return;
    const cs = []; snap.forEach(d => cs.push(d.data()));
    cs.sort((a, b) => (b.criadoEm && b.criadoEm.seconds || 0) - (a.criadoEm && a.criadoEm.seconds || 0));
    L.innerHTML = cs.length ? cs.map(cardClasse).join("")
      : '<div class="card mut">Você ainda não tem classes. Crie a primeira abaixo.</div>';
    ligarClasses(L);
  }, e => console.error(e));
}
function cardClasse(c) {
  const cod = esc(c.codigo);
  if (editC[c.codigo] !== undefined) {
    return '<div class="card"><div class="mut">Código: <b>' + cod + '</b></div><div class="row" style="margin-top:6px"><input data-ec="' + cod + '" value="' + esc(editC[c.codigo]) + '" placeholder="Nome da classe" style="flex:1;min-width:180px"><button class="btn sm" data-sv="' + cod + '">Salvar</button><button class="btn sec sm" data-cn="' + cod + '">Cancelar</button></div></div>';
  }
  if (delC[c.codigo]) {
    return '<div class="card"><b>' + esc(c.nome) + '</b><div class="mut">Código: <b>' + cod + '</b></div><div class="aviso">Apagar esta classe? Todos os alunos dela e o progresso deles serão apagados. <b>Isso não pode ser desfeito.</b><div class="row" style="margin-top:8px"><button class="btn sm del" data-dy="' + cod + '">Sim, apagar</button><button class="btn sec sm" data-dn="' + cod + '">Cancelar</button></div></div></div>';
  }
  return '<div class="card"><div class="row" style="justify-content:space-between"><div><b>' + esc(c.nome) + '</b><div class="mut">Código: <b>' + cod + '</b></div></div><div class="row"><button class="btn sm" data-c="' + cod + '" data-n="' + esc(c.nome) + '">Abrir</button><button class="btn sec sm" data-ed="' + cod + '" data-n="' + esc(c.nome) + '">Editar</button><button class="btn sec sm perig" data-ap="' + cod + '">Apagar</button></div></div></div>';
}
function ligarClasses(L) {
  const ativo = document.activeElement, focoC = ativo && ativo.dataset && ativo.dataset.ec;
  L.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => telaClasse(b.dataset.c, b.dataset.n));
  L.querySelectorAll("button[data-ed]").forEach(b => b.onclick = () => { editC[b.dataset.ed] = b.dataset.n; delete delC[b.dataset.ed]; redesenharClasses(); });
  L.querySelectorAll("button[data-ap]").forEach(b => b.onclick = () => { delC[b.dataset.ap] = true; delete editC[b.dataset.ap]; redesenharClasses(); });
  L.querySelectorAll("button[data-cn]").forEach(b => b.onclick = () => { delete editC[b.dataset.cn]; redesenharClasses(); });
  L.querySelectorAll("button[data-dn]").forEach(b => b.onclick = () => { delete delC[b.dataset.dn]; redesenharClasses(); });
  L.querySelectorAll("input[data-ec]").forEach(i => {
    i.oninput = () => { editC[i.dataset.ec] = i.value; };
    i.onkeydown = e => { if (e.key === "Enter") salvarClasse(i.dataset.ec); };
  });
  L.querySelectorAll("button[data-sv]").forEach(b => b.onclick = () => salvarClasse(b.dataset.sv));
  L.querySelectorAll("button[data-dy]").forEach(b => b.onclick = () => apagarClasse(b.dataset.dy, b));
  if (focoC) { const i = L.querySelector('input[data-ec="' + focoC + '"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
// Força redesenho a partir do último estado (relê o cache do Firestore)
async function redesenharClasses() {
  const L = $("#lista"); if (!L) return;
  try {
    const snap = await getDocs(query(collection(db, "classes"), where("instrutorUid", "==", user.uid)));
    const cs = []; snap.forEach(d => cs.push(d.data()));
    cs.sort((a, b) => (b.criadoEm && b.criadoEm.seconds || 0) - (a.criadoEm && a.criadoEm.seconds || 0));
    L.innerHTML = cs.length ? cs.map(cardClasse).join("") : '<div class="card mut">Você ainda não tem classes. Crie a primeira abaixo.</div>';
    ligarClasses(L);
  } catch (e) { console.error(e); }
}
async function salvarClasse(cod) {
  const nome = (editC[cod] || "").trim(), m = $("#mc");
  if (!nome) { m.textContent = "O nome da classe não pode ficar vazio."; return; }
  try {
    await updateDoc(doc(db, "classes", cod), { nome: nome });
    delete editC[cod]; m.textContent = "";
    redesenharClasses();
  } catch (e) { console.error(e); m.textContent = "Não foi possível renomear a classe. (" + (e.code || e.message) + ")"; }
}
async function apagarClasse(cod, btn) {
  const m = $("#mc"); if (btn) btn.disabled = true;
  try {
    // 1) apaga os alunos da classe (o Firestore não apaga subcoleções sozinho)
    const snap = await getDocs(collection(db, "classes", cod, "alunos"));
    const ds = snap.docs;
    for (let i = 0; i < ds.length; i += 400) {
      const b = writeBatch(db);
      ds.slice(i, i + 400).forEach(d => b.delete(d.ref));
      await b.commit();
    }
    // 2) apaga a classe
    await deleteDoc(doc(db, "classes", cod));
    delete delC[cod]; m.textContent = "";
  } catch (e) { console.error(e); m.textContent = "Não foi possível apagar a classe. (" + (e.code || e.message) + ")"; if (btn) btn.disabled = false; }
}
function pedidosAdmin() {
  unsubSol = onSnapshot(collection(db, "solicitacoes"), snap => {
    const box = $("#adm"); if (!box) return;
    const L = []; snap.forEach(d => { const v = d.data(); if (v.status === "pendente") L.push(Object.assign({ _id: d.id }, v)); });
    if (!L.length) { box.innerHTML = ""; return; }
    box.innerHTML = '<h2>Pedidos de acesso (' + L.length + ')</h2>' + L.map(v => '<div class="card"><b>' + esc(v.nome) + '</b><div class="mut">' + esc(v.email) + '</div><div class="row" style="margin-top:8px"><button class="btn sm" data-ap="' + esc(v._id) + '">Aprovar</button><button class="btn sec sm" data-re="' + esc(v._id) + '">Recusar</button></div></div>').join("");
    box.querySelectorAll("button[data-ap]").forEach(b => b.onclick = async () => {
      const v = L.find(x => x._id === b.dataset.ap); b.disabled = true;
      try {
        await setDoc(doc(db, "instrutores", v._id), { nome: v.nome || "", email: v.email || "", aprovadoPor: user.uid, criadoEm: serverTimestamp() });
        await deleteDoc(doc(db, "solicitacoes", v._id));
      } catch (e) { console.error(e); alert("Não foi possível aprovar. (" + (e.code || e.message) + ")"); b.disabled = false; }
    });
    box.querySelectorAll("button[data-re]").forEach(b => b.onclick = async () => {
      try { await deleteDoc(doc(db, "solicitacoes", b.dataset.re)); } catch (e) { console.error(e); }
    });
  }, e => console.error(e));
}
async function criarClasse() {
  const nome = $("#nc").value.trim(), m = $("#m");
  if (!nome) { m.textContent = "Dê um nome para a classe."; return; }
  try {
    let cod = novoCodigo();
    for (let t = 0; t < 5 && (await getDoc(doc(db, "classes", cod))).exists(); t++) cod = novoCodigo();
    await setDoc(doc(db, "classes", cod), { codigo: cod, nome: nome, instrutorUid: user.uid, criadoEm: serverTimestamp() });
    $("#nc").value = ""; m.textContent = "";
  } catch (e) { console.error(e); m.textContent = "Não foi possível criar a classe. (" + (e.code || e.message) + ")"; }
}

/* ===== Uma classe: acompanhamento ao vivo ===== */
function telaClasse(cod, nome) {
  pararTudo(); classeAtual = cod; aberto = {}; alunos = []; editA = {}; remA = {};
  main.innerHTML = '<p><a class="link" id="voltar">← Minhas classes</a></p>' +
    '<div class="card"><div class="mut">' + esc(nome) + '</div><div class="code">' + esc(cod) + '</div>' +
    '<p class="mut" style="margin:6px 0 10px">Passe este código aos alunos. Eles entram em <b>Sou aluno</b>.</p><button class="btn sec sm" id="cp">Copiar código</button></div>' +
    '<h2>Alunos</h2><div id="ma" class="msg"></div><div id="al"><div class="card mut">Aguardando os alunos entrarem…</div></div>' + guiaBloco();
  $("#voltar").onclick = telaClasses;
  ligarGuia();
  $("#cp").onclick = () => { try { navigator.clipboard.writeText(cod); $("#cp").textContent = "Copiado ✔"; } catch (e) {} };
  unsubAlunos = onSnapshot(collection(db, "classes", cod, "alunos"), snap => {
    alunos = []; snap.forEach(d => alunos.push(Object.assign({ _id: d.id }, d.data())));
    desenhar();
  }, e => console.error(e));
}

async function desenhar() {
  const box = $("#al"); if (!box) return;
  if (!alunos.length) { box.innerHTML = '<div class="card mut">Aguardando os alunos entrarem…</div>'; return; }
  alunos.sort((a, b) => ((b.chamou && !b.chamou.atendido) ? 1 : 0) - ((a.chamou && !a.chamou.atendido) ? 1 : 0)
    || (b.atualizadoEm && b.atualizadoEm.seconds || 0) - (a.atualizadoEm && a.atualizadoEm.seconds || 0));
  const html = [];
  const sel = $("#sel"); if (sel && !sel.dataset.m && alunos[0] && alunos[0].estudo) sel.value = alunos[0].estudo;
  for (const d of alunos) {
    const n = d.estudo, st = n ? d["e" + n] : null;
    let Q = null; if (n) { try { Q = await carregarEstudo(n); } catch (e) {} }
    const NQ = Q ? Q.length : null;
    const i = st ? st.i : -1;
    const chamou = d.chamou && !d.chamou.atendido;
    let status = "Ainda não começou", pct = 0;
    if (st && n) {
      if (st.d) { status = "Estudo " + n + " concluído ✔"; pct = 100; }
      else if (i < 0) status = "Estudo " + n + " · na abertura";
      else if (NQ && i < NQ) { status = "Estudo " + n + " · pergunta " + (i + 1) + " de " + (NQ - 1); pct = Math.round(i / (NQ + 1) * 100); }
      else { status = "Estudo " + n + " · compromisso de fé"; pct = 95; }
    }
    const erros = n ? totalErros(d, n) : 0;
    const concl = Object.keys(d.concluidos || {}).map(k => k.replace("e", "")).sort((a, b) => a - b).join(", ");
    const rein = n && d.reinicios ? (d.reinicios["e" + n] || 0) : 0;
    const id = esc(d._id);
    const painelEdicao = editA[d._id] !== undefined
      ? '<div class="row" style="margin-top:8px"><input data-ea="' + id + '" value="' + esc(editA[d._id]) + '" placeholder="Nome do aluno" style="flex:1;min-width:160px"><button class="btn sm" data-sa="' + id + '">Salvar</button><button class="btn sec sm" data-ca="' + id + '">Cancelar</button></div>' : '';
    const painelRemocao = remA[d._id]
      ? '<div class="aviso">Remover <b>' + esc(d.nome) + '</b> desta classe? O progresso dele(a) será apagado. <b>Isso não pode ser desfeito.</b><div class="row" style="margin-top:8px"><button class="btn sm del" data-ry="' + id + '">Sim, remover</button><button class="btn sec sm" data-rn="' + id + '">Cancelar</button></div></div>' : '';
    html.push('<div class="card alu' + (chamou ? ' call' : '') + '"><div class="row" style="justify-content:space-between"><span class="nm">' + esc(d.nome) + '</span><span class="tag">' + quando(d.atualizadoEm) + '</span></div>' +
      (chamou ? '<div style="margin:6px 0"><span class="badge red">🔔 Chamou o instrutor · pergunta ' + ((d.chamou.pergunta != null ? d.chamou.pergunta + 1 : "?")) + '</span> <button class="btn sm" data-at="' + id + '">Atendido</button></div>' : '') +
      '<div>' + esc(status) + '</div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div><span class="badge">Erros: ' + erros + '</span>' + (rein ? '<span class="badge">↻ recomeçou ' + rein + 'x</span>' : '') + (concl ? '<span class="badge ok">Concluídos: ' + esc(concl) + '</span>' : '') + ' <button class="link a" data-t="' + id + '">' + (aberto[d._id] ? "Ocultar detalhes" : "Ver detalhes e respostas") + '</button></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn sec sm" data-ra="' + id + '" data-n="' + esc(d.nome) + '">✎ Renomear</button><button class="btn sec sm perig" data-rm="' + id + '">Remover da classe</button></div>' +
      painelEdicao + painelRemocao +
      (aberto[d._id] ? detalhe(d, Q, n, i) : '') + '</div>');
  }
  // guarda o foco do campo de nome (se estiver digitando) para restaurar após o redesenho
  const ativo = document.activeElement, focoA = ativo && ativo.dataset && ativo.dataset.ea;
  if (!$("#al")) return;
  box.innerHTML = html.join("");
  box.querySelectorAll("button[data-t]").forEach(b => b.onclick = () => { aberto[b.dataset.t] = !aberto[b.dataset.t]; desenhar(); });
  box.querySelectorAll("button[data-at]").forEach(b => b.onclick = async () => {
    try { await updateDoc(doc(db, "classes", classeAtual, "alunos", b.dataset.at), { "chamou.atendido": true }); } catch (e) { console.error(e); }
  });
  // renomear aluno
  box.querySelectorAll("button[data-ra]").forEach(b => b.onclick = () => { editA[b.dataset.ra] = b.dataset.n; delete remA[b.dataset.ra]; desenhar(); });
  box.querySelectorAll("button[data-ca]").forEach(b => b.onclick = () => { delete editA[b.dataset.ca]; desenhar(); });
  box.querySelectorAll("input[data-ea]").forEach(i => {
    i.oninput = () => { editA[i.dataset.ea] = i.value; };
    i.onkeydown = e => { if (e.key === "Enter") salvarAluno(i.dataset.ea); };
  });
  box.querySelectorAll("button[data-sa]").forEach(b => b.onclick = () => salvarAluno(b.dataset.sa));
  // remover aluno
  box.querySelectorAll("button[data-rm]").forEach(b => b.onclick = () => { remA[b.dataset.rm] = true; delete editA[b.dataset.rm]; desenhar(); });
  box.querySelectorAll("button[data-rn]").forEach(b => b.onclick = () => { delete remA[b.dataset.rn]; desenhar(); });
  box.querySelectorAll("button[data-ry]").forEach(b => b.onclick = () => removerAluno(b.dataset.ry, b));
  if (focoA) { const i = box.querySelector('input[data-ea="' + focoA + '"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
async function salvarAluno(id) {
  const nome = (editA[id] || "").trim(), m = $("#ma");
  if (!nome) { m.textContent = "O nome do aluno não pode ficar vazio."; return; }
  try {
    await updateDoc(doc(db, "classes", classeAtual, "alunos", id), { nome: nome });
    delete editA[id]; m.textContent = "";
    desenhar();
  } catch (e) { console.error(e); m.textContent = "Não foi possível renomear o aluno. (" + (e.code || e.message) + ")"; }
}
async function removerAluno(id, btn) {
  const m = $("#ma"); if (btn) btn.disabled = true;
  try {
    await deleteDoc(doc(db, "classes", classeAtual, "alunos", id));
    delete remA[id]; delete editA[id]; delete aberto[id]; m.textContent = "";
  } catch (e) { console.error(e); m.textContent = "Não foi possível remover o aluno. (" + (e.code || e.message) + ")"; if (btn) btn.disabled = false; }
}

function detalhe(d, Q, n, i) {
  if (!Q || !n) return '<div class="mut" style="margin-top:8px">Sem detalhes ainda.</div>';
  const st = d["e" + n] || {}, a = st.a || {}, h = [];
  const fim = Math.min(Math.max(i, 0), Q.length - 1);
  for (let k = 0; k <= fim; k++) {
    const q = Q[k], cur = (k === i), er = (d.erros || {})["e" + n + "_q" + k] || 0;
    const resp = respAluno(q, a[k]);
    let ult = "";
    if (cur && d.ult && d.ult.estudo === n && d.ult.pergunta === k) {
      const u = d.ult, p = [];
      if (u.f && u.f.some(x => x)) p.push(u.f.join(" · "));
      if (u.o) p.push(u.o);
      if (u.v && u.v.length && q.i) p.push(u.v.map((x, j) => (j + 1) + ") " + (x === 1 ? "V" : x === 0 ? "F" : "—")).join("  "));
      if (p.length) ult = '<div class="stu">Última tentativa errada: ' + esc(p.join(" | ")) + '</div>';
    }
    h.push('<div class="q' + (cur ? ' cur' : '') + '"><div class="tag">' + (q.recap ? "Recapitulação" : "Pergunta " + (k + 1)) + (cur ? " · AGORA" : "") + (er ? " · " + er + " erro(s)" : "") + '</div>' +
      '<div><b>' + esc(q.q) + '</b></div>' +
      '<div class="esp">Resposta esperada: ' + esc(esperado(q)) + '</div>' +
      (resp ? '<div class="stu">Aluno respondeu: ' + esc(resp) + ' ✔</div>' : '') + ult + '</div>');
  }
  return '<div style="margin-top:8px">' + h.join("") + '</div>';
}

/* ===== Guia do instrutor ===== */
function guiaBloco() {
  return '<h2>Guia do instrutor</h2><div class="card row"><select id="sel" onchange="this.dataset.m=1">' + TITULOS.map((t, k) => '<option value="' + (k + 1) + '">Estudo ' + (k + 1) + ' · ' + esc(t) + '</option>').join("") + '</select><button class="btn" id="ver">Ver guia</button></div><div id="g"></div>';
}
function ligarGuia() {
  $("#ver").onclick = async () => {
    const n = +$("#sel").value, g = $("#g"); g.innerHTML = '<div class="card mut">Carregando…</div>';
    try {
      const Q = await carregarEstudo(n);
      g.innerHTML = Q.map((q, k) => '<div class="card"><div class="tag">' + (q.recap ? "Recapitulação" : "Pergunta " + (k + 1)) + '</div><div><b>' + esc(q.q) + '</b></div>' +
        (q.v ? '<div class="mut">Textos: ' + q.v.map(x => esc(x[0])).join(" · ") + '</div>' : '') +
        '<div class="esp">Resposta: ' + esc(esperado(q)) + '</div>' +
        (q.h ? '<div class="mut">Dica: ' + esc(q.h) + '</div>' : '') + (q.n ? '<div class="mut">Nota: ' + esc(q.n) + '</div>' : '') + '</div>').join("");
    } catch (e) { g.innerHTML = '<div class="card mut">Este estudo ainda não foi publicado.</div>'; }
  };
}
function telaGuia() {
  pararTudo();
  main.innerHTML = '<p><a class="link" id="voltar">← Minhas classes</a></p>' + guiaBloco();
  $("#voltar").onclick = telaClasses;
  ligarGuia();
}
</script>
