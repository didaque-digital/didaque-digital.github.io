<script>
// ====== CONFIGURAÇÃO ======
var TEACHER_CODE = "Z6B2";   // código do instrutor (mostra a resposta)
var NEXT_CODE = "OCP9";      // código que libera o Estudo 9 (O Chifre Pequeno e o ataque à lei de Deus)
var KEY = "didaque_e108_v1";  // progresso deste estudo (série Daniel: ids 101, 102...)

// Tipos: p = completar | i = V/F | o = múltipla escolha | w = escrever uma frase
// n = texto de apoio | m = "Saiba mais" (abre e fecha) | r = resposta de referência (tipo w)
var Q = [
 {q:"No primeiro ano do rei Belsazar, que sonho Daniel teve?",
  v:[["Daniel 7:1-3","dan 7:1-3"]],
  p:["Ele viu ",["quatro","quatro","=4"]," animais grandes, diferentes uns dos outros, que subiam do mar."],
  h:"Daniel 7:3: quatro animais grandes, diferentes um do outro, subiam do mar.",
  n:"Esse sonho ocorreu no primeiro ano de Belsazar, por volta de 550 a.C. Os capítulos de Daniel nem sempre seguem a ordem cronológica: os acontecimentos dos capítulos 5 e 6 vieram depois desta visão.",
  m:"Provavelmente Daniel estava com cerca de 73 anos. Na visão, o Grande Mar era agitado pelos quatro ventos do céu."},
 {q:"O que representam os quatro animais que subiam do mar?",
  v:[["Daniel 7:17","dan 7:17"]],
  p:["Os quatro animais representam quatro ",["reinos","reino","reis"],"."],
  h:"Daniel 7:17: esses grandes animais são quatro reis que se levantarão da terra.",
  n:"Os animais representam reis ou reinos. Essa visão tem um paralelo íntimo com o sonho de Nabucodonosor (capítulo 2): os mesmos impérios, antes representados pelos metais da estátua, aparecem agora como animais."},
 {q:"Como era o primeiro animal?",

  p:["Um ",["leão","leao"]," com asas de ",["águia","aguia"],"."],
  h:"Daniel 7:4: o primeiro era como leão e tinha asas de ave de rapina.",

 {q:"Que características tinha o segundo animal?",
  v:[["Daniel 7:5","dan 7:5"]],
  o:["Um animal terrível e espantoso","Um urso com três costelas na boca","Um leão com três costelas nas costas"], c:1,
  h:"Daniel 7:5: o segundo animal era semelhante a um urso e tinha três costelas entre os dentes.",
  n:"O segundo animal, o urso, representa o Império Medo-Pérsia. Ele se levantou de um lado porque, na queda de Babilônia, os medos eram superiores aos persas, situação que depois se inverteu. As três costelas representam as principais conquistas: Lídia (547 a.C.), Babilônia (539 a.C.) e Egito (525 a.C.).",

 {q:"Descreva o terceiro animal.",
  v:[["Daniel 7:6","dan 7:6"]],
  p:["Um ",["leopardo","leopard"]," com quatro ",["asas","asa"]," de ave nas costas e quatro ",["cabeças","cabeca"],"."],
  h:"Daniel 7:6: semelhante a um leopardo, com quatro asas de ave e quatro cabeças.",
  n:"O leopardo representa a Grécia. O próprio livro confirma isso: no capítulo 8, o anjo Gabriel diz que o bode peludo é o rei da Grécia. As quatro asas mostram a velocidade com que Alexandre, o Grande, venceu os exércitos inimigos, e as quatro cabeças, os quatro generais que dominaram o império depois dele.",
  m:"Os quatro generais foram Cassandro, Lisímaco, Ptolomeu e Seleuco. A Grécia dominou de 331 a 168 a.C., o período dos quadris de bronze da estátua."},
 {q:"Como Daniel descreve o quarto animal?",
  v:[["Daniel 7:7","dan 7:7"]],
  s:"Marque V ou F em cada frase:",
  i:[["Era terrível e espantoso.",1],["Era muito forte.",1],["Tinha grandes dentes de ferro.",1],["Era parecido com os outros animais.",0]],
  h:"Daniel 7:7: o quarto animal era diferente de todos os que apareceram antes dele.",
  n:"O quarto animal representa Roma, o poder mundial que sucedeu a Grécia. Os dentes de ferro lembram as pernas de ferro da estátua e a crueldade com que Roma tratava os seus inimigos. O Império Romano dominou de 168 a.C. a 476 d.C.",
  m:"O ano de 168 a.C. é a data mais aceita para a ascensão desse império, quando os romanos conquistaram a Macedônia."},
 {q:"Que garantia Deus deu ao seu povo em meio às ameaças das nações? Responda com poucas palavras.",

  n:"Diante do cenário assustador da visão, Daniel recebeu de Deus conforto e esperança: os santos do Altíssimo teriam a vitória final, pois o Senhor faria justiça ao seu povo. Todos os reinos da visão passariam, mas o reino de Deus pertencerá para sempre aos que forem fiéis ao Senhor.",

var NQ = Q.length, TOTAL = NQ + 2;
var $ = function(s){return document.querySelector(s)}, app = $("#app");
var st = {i:-1,u:0}; try{var sv=JSON.parse(localStorage.getItem(KEY)); if(sv) st=sv;}catch(e){}

var muted=false, tries=0, sel={}, ac;

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function match(v,a){ if(a.charAt(0)==="=") return (" "+v+" ").indexOf(" "+norm(a.slice(1))+" ")>-1; return v.indexOf(norm(a))>-1; }
function accepted(x){ return x.length>1 ? x.slice(1) : x; }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tone(seq){ if(muted) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var t=ac.currentTime;
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type=n[2]||"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]);t+=n[1]+.06}); }catch(e){} }
var BAD=[[190,.18,"square"],[150,.3,"square"]], GOOD=[[660,.12],[880,.22]];

var BIB = {
 "dan 7:1-3": [[1, "No primeiro ano de Belsazar, rei da Babilônia, Daniel teve um sonho e visões enquanto estava na cama; logo escreveu o sonho e relatou o resumo das coisas."],[2, "Daniel disse: Eu olhava na minha visão da noite, e eis que os quatro ventos do céu agitavam o mar grande."],[3, "E quatro animais grandes, diferentes uns dos outros, subiam do mar."]],
 "dan 7:4": [[4, "O primeiro era como um leão e tinha asas de águia; eu olhava até que as suas asas foram arrancadas, e ele foi levantado da terra e posto em pé como um homem; e lhe foi dado coração de homem."]],
 "dan 7:5": [[5, "Continuei olhando, e eis um segundo animal, semelhante a um urso, que se levantou de um lado e tinha na boca, entre os dentes, três costelas; e lhe disseram: Levante-se, devore muita carne."]],
 "dan 7:6": [[6, "Depois disso, continuei olhando, e eis outro animal, semelhante a um leopardo, que tinha quatro asas de ave nas costas; esse animal tinha também quatro cabeças, e lhe foi dado domínio."]],
 "dan 7:7": [[7, "Depois disso, continuei olhando nas visões da noite, e eis o quarto animal, terrível, espantoso e muito forte, que tinha grandes dentes de ferro; ele devorava, despedaçava e pisava o que sobrava; era diferente de todos os animais que apareceram antes dele e tinha dez chifres."]],
 "dan 7:17": [[17, "Esses grandes animais, que são quatro, são quatro reis que se levantarão da terra."]],
 "dan 7:18-27": [[18, "Mas os santos do Altíssimo receberão o reino e o possuirão para sempre, de eternidade em eternidade."],[22, "até que veio o Ancião de dias, e foi dado o juízo aos santos do Altíssimo; e chegou o tempo em que os santos possuíram o reino."],[27, "O reino, o domínio e a grandeza dos reinos debaixo de todo o céu serão dados ao povo dos santos do Altíssimo; o seu reino será um reino eterno, e todos os domínios o servirão e lhe obedecerão."]]
};

function openBible(list,opener,start){
  bibList=list; bibFocus=opener||document.activeElement;
  var tabs=$("#mtabs");
  tabs.innerHTML = list.length>1 ? list.map(function(x,k){return '<button class="tab" data-k="'+k+'">'+esc(x[0])+'</button>'}).join("") : "";
  tabs.style.display = list.length>1 ? "flex" : "none";
  tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showRef(+b.dataset.k)}});
  $("#ov").classList.add("on"); $("#ov").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); bibOpen=true;
  try{history.pushState({bib:1},"")}catch(e){}
  showRef(start||0); $("#mx").focus();
}
function closeBible(fromPop){
  if(!bibOpen) return;
  bibOpen=false;
  $("#ov").classList.remove("on"); $("#ov").setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(!fromPop){ try{ if(history.state&&history.state.bib) history.back(); }catch(e){} }
  try{ bibFocus&&bibFocus.focus&&bibFocus.focus(); }catch(e){}
}
function showRef(k){
  var item=bibList[k], body=$("#mbody");
  document.querySelectorAll("#mtabs .tab").forEach(function(b,j){b.classList.toggle("sel",j===k)});
  body.scrollTop=0;
  var vs=BIB[item[1]], multi=vs&&vs.length>1;
  body.innerHTML = vs ? '<h2>'+esc(item[0])+'</h2>'+vs.map(function(v){return '<p class="vs">'+(multi?'<sup>'+v[0]+'</sup>':'')+esc(v[1])+'</p>'}).join("")+'<div class="ver">Tradução: '+esc(BIBNAME)+'</div>' : '<h2>'+esc(item[0])+'</h2><p>Texto não encontrado.</p>';
}
$("#mx").onclick=function(){closeBible()};
$("#mclose").onclick=function(){closeBible()};
$("#ov").addEventListener("click",function(e){ if(e.target===this) closeBible(); });

window.addEventListener("popstate",function(){ if(bibOpen) closeBible(true); });

function render(){

  if(i<0){ app.innerHTML='<div class="card"><p class="q">Vamos começar</p><p class="intro">Você já reparou que, numa família, mesmo com muitos membros, cada um tem as suas peculiaridades? Na natureza também é assim: num zoológico, fica clara a diferença entre os animais. No capítulo 7 de Daniel, Deus mostrou ao profeta vários animais com aparências bem diferentes das que estamos acostumados a ver. Vamos observar cada característica e descobrir o significado desses animais proféticos.</p><p class="mut">Tente responder cada pergunta. Se errar, é só tentar de novo: você só avança quando acertar. Se ficar difícil, leia o texto bíblico indicado ou peça ajuda ao seu instrutor.</p><button class="btn" id="go">Começar</button></div>'; $("#go").onclick=function(){st.i=0;save();render()}; return; }
  if(i<NQ) return question(Q[i],i);
  if(i===NQ){ app.innerHTML='<div class="card"><p class="q">Minha decisão</p><p>Se quiser, marque o que você deseja assumir:</p><label class="chk"><input type="checkbox"><span>Vou estudar a Bíblia todos os dias para continuar aprendendo os seus ensinos.</span></label><label class="chk"><input type="checkbox"><span>Vou confiar sempre que o Deus eterno controla o destino das nações.</span></label><label class="chk"><input type="checkbox"><span>Vou entregar o meu coração e a minha vontade a Deus, para um dia ser cidadão do reino que ele em breve estabelecerá, quando voltar.</span></label><button class="btn" id="nx">Concluir o estudo</button></div>'; $("#nx").onclick=function(){st.i=NQ+1;save();render()}; return; }
  if(!st.d){st.d=1;save();}
  app.innerHTML='<div class="card"><p class="q">Parabéns! Você concluiu o Estudo 8.</p><p>Próximo estudo: <b>O chifre pequeno e o ataque à lei de Deus</b>. Quando o seu instrutor passar o código na aula, digite aqui para liberar.</p><div class="tc"><input id="nc" placeholder="Código do próximo estudo" autocomplete="off" autocapitalize="characters"><button class="btn sec" id="nok" style="margin:0">Liberar</button></div><div id="nm"></div><a class="btn sec" href="../estudos/">Voltar à lista de estudos</a></div>';
  function lib(){ var d=$("#nc").value.trim().toUpperCase(); if(!d) return; if(d===NEXT_CODE){ st.u=1; save(); tone(GOOD); $("#nm").innerHTML='<div class="msg ok">Estudo 9 liberado!</div><a class="btn" href="../estudo-9/">Ir para o Estudo 9</a>'; } else { tone(BAD); $("#nm").innerHTML='<div class="msg no">Código incorreto. Peça ao seu instrutor.</div>'; } }
  $("#nok").onclick=lib; $("#nc").addEventListener("keydown",function(e){if(e.key==="Enter")lib()});
  if(st.u) $("#nm").innerHTML='<div class="msg ok">Estudo 9 liberado!</div><a class="btn" href="../estudo-9/">Ir para o Estudo 9</a>';
}

function question(q,i){
  var h='<div class="card" id="c"><div class="q">'+(i+1)+". "+q.q+'</div>';
  if(q.v) h+='<div class="ref">📖 '+q.v.map(function(x,k){return '<button class="refbtn" data-k="'+k+'">'+esc(x[0])+'</button>'}).join(" · ")+' <span class="mut">· toque para ler</span></div>'; else h+='<div class="ref"></div>';
  var parts={
    p:function(){ var k=0; return '<p class="s">'+q.p.map(function(x){return typeof x==="string"?x:'<input class="b" data-k="'+(k++)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta '+k+'">'}).join("")+'</p>'; },
    i:function(){ return (q.s?'<p class="sub">'+q.s+'</p>':'')+q.i.map(function(x,k){return '<div class="row"><span>'+x[0]+'</span><span class="vf" data-k="'+k+'"><button data-v="1" aria-label="Verdadeiro">V</button><button data-v="0" aria-label="Falso">F</button></span></div>'}).join(""); },
    o:function(){ return q.o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x+'</button>'}).join(""); },
    w:function(){ return '<textarea class="wt" id="wt" rows="3" maxlength="300" placeholder="Escreva aqui, com suas palavras"></textarea>'; }
  };
  "poiw".split("").forEach(function(c){ if(q[c]) h+=parts[c](); });
  h+='<div id="fb"></div><button class="btn" id="ck">Verificar</button></div>';
  app.innerHTML=h;
  document.querySelectorAll(".refbtn").forEach(function(b){b.onclick=function(){openBible(q.v,b,+b.dataset.k)}});
  document.querySelectorAll(".vf button").forEach(function(b){b.onclick=function(){var p=b.parentNode;p.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel[p.dataset.k]=+b.dataset.v}});
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel.c=+b.dataset.k}});
  $("#ck").onclick=function(){check(q,i)};
  document.querySelectorAll("input.b").forEach(function(f){f.addEventListener("keydown",function(e){if(e.key==="Enter")check(q,i)})});
  var sa=st.a&&st.a[i]; if(sa){ putAns(q,sa); check(q,i,true); }
}

function canonAns(q){ var a={}; if(q.p) a.f=q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ a.v[k]=x[1]; }); } if(q.o) a.c=q.c; if(q.w) a.f=[q.rf]; return a; }
function readAns(q){ var a={}; if(q.p) a.f=[].map.call(document.querySelectorAll("input.b"),function(x){return x.value}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ if(sel[k]!==undefined) a.v[k]=sel[k]; }); } if(q.o&&sel.c!==undefined) a.c=sel.c; if(q.w) a.f=[$("#wt").value.trim()]; return a; }
function putAns(q,a){
  if(a.f) [].forEach.call(document.querySelectorAll("input.b"),function(x,k){ x.value=a.f[k]||""; });
  if(a.v) Object.keys(a.v).forEach(function(k){ sel[k]=a.v[k]; var g=document.querySelector('.vf[data-k="'+k+'"]'); if(g) g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("sel",+b.dataset.v===a.v[k]); }); });
  if(a.c!==undefined){ sel.c=a.c; document.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel",+b.dataset.k===a.c); }); }
  if(q.w&&a.f&&$("#wt")) $("#wt").value=a.f[0]||"";
}
function answerText(q){
  var a=[];
  if(q.p) a.push(q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}).join(" · "));
  if(q.i) a.push(q.i.map(function(x){return (x[1]?"V":"F")}).join(" · "));
  if(q.o) a.push(q.o[q.c]);
  if(q.w) a.push(q.rf);
  return a.join(" | ");
}
function check(q,i,silent){
  var ok=true, fb=$("#fb"), card=$("#c");
  if(q.p){ var k=0; q.p.forEach(function(x){ if(typeof x==="string")return; var inp=document.querySelector('input[data-k="'+(k++)+'"]'); var v=norm(inp.value); var good=!!v&&accepted(x).some(function(a){return match(v,a)}); inp.classList.toggle("ok",good); inp.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.i){ q.i.forEach(function(x,k){ var g=document.querySelector('.vf[data-k="'+k+'"]'); var good=sel[k]===x[1]; g.classList.toggle("ok",good); g.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.o){ document.querySelectorAll(".opt").forEach(function(b){b.classList.remove("ok","no")}); var b=document.querySelector('.opt[data-k="'+sel.c+'"]'); if(sel.c===undefined) ok=false; else { b.classList.add(sel.c===q.c?"ok":"no"); if(sel.c!==q.c) ok=false; } }
  if(q.w){ var wt=$("#wt"), good=wt.value.trim().length>=8; wt.classList.toggle("ok",good); wt.classList.toggle("no",!good); if(!good) ok=false; }
  if(ok) return acerto(q,i,silent);
  if(silent) return;
  tries++; tone(BAD); try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  var m='<div class="msg no">'+(q.w?'Escreva ao menos uma frase curta, com suas palavras.':'Ainda não. Releia o texto e tente de novo.')+'</div>';
  if(tries>=2) m+='<div class="hint">💡 Dica: '+q.h+'</div>';
  if(tries>=3) m+='<button class="btn sec" id="ti">Chamar o instrutor</button><div id="tb"></div>';
  fb.innerHTML=m;
  if(tries>=3) $("#ti").onclick=function(){ $("#tb").innerHTML='<div class="tc"><input id="tcd" type="password" placeholder="Código do instrutor"><button class="btn sec" id="tok" style="margin:0">OK</button></div><div id="tr"></div>'; $("#tok").onclick=function(){ if($("#tcd").value===TEACHER_CODE){ $("#tr").innerHTML='<div class="note">Resposta: '+answerText(q)+'</div><button class="btn" id="sk">Seguir adiante</button>'; $("#sk").onclick=function(){ st.a=st.a||{}; st.a[i]=canonAns(q); avancar(); }; } else {$("#tr").innerHTML='<div class="msg no">Código incorreto.</div>';tone(BAD)} } };
}
function acerto(q,i,silent){
  if(!silent){ st.a=st.a||{}; st.a[i]=readAns(q); save(); tone(GOOD); }
  document.querySelectorAll("input.b,.opt,.vf button,.wt").forEach(function(x){x.disabled=true});
  var h='<div class="msg ok">Muito bem! ✔</div>'+(q.rf?'<div class="note"><b>Resposta de referência:</b> '+q.rf+'</div>':'')+(q.n?'<div class="note">'+q.n+'</div>':'')+(q.m?'<details class="det"><summary>Saiba mais</summary><p>'+q.m+'</p></details>':'')+'<button class="btn" id="nx">'+(i===NQ-1?"Continuar":"Próxima pergunta")+'</button>';
  $("#fb").innerHTML=h; $("#ck").style.display="none"; $("#nx").onclick=avancar; if(!silent) $("#nx").focus();
}
function avancar(){ st.i++; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function voltar(){ if(st.i<=0) return; closeBible(); st.i--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#back").onclick=voltar;
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇 Som desligado":"🔊 Som ligado"};
$("#reset").onclick=function(){ st={i:-1,u:0}; save(); render(); };
render();
</script>
<script type="module" src="../../comum/didaque.js"></script>
