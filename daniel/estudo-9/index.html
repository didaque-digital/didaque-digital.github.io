 {q:"Dos quatro animais vistos no estudo anterior, qual deles despertou o maior interesse de Daniel?",

 {q:"O que representam os dez chifres do quarto animal?",
  v:[["Daniel 7:24","dan 7:24"]],
  p:["Os dez chifres representam dez ",["reinos","reino","reis","nacoes","tribos"],"."],
  h:"Daniel 7:24: os dez chifres são dez reis, ou reinos, que se levantariam daquele mesmo reino.",
  n:"Chifres, em profecia, simbolizam reinos. Esses dez são os reinos que surgiram do Império Romano. Roma manteve o poder até 476 d.C., quando caiu o seu último imperador, Rômulo Augusto. Assim como os pés da estátua tinham dez dedos, e o quarto animal, dez chifres, Roma perdeu o poder para dez tribos bárbaras, que, ao longo de décadas, foram minando a sua autoridade.",
  m:"<p>Tribos que se estabeleceram no território de Roma entre 351 e 476 d.C. e as nações que formaram:</p><table><tr><td>351</td><td>Alamanos</td><td>Alemanha</td></tr><tr><td>351</td><td>Francos</td><td>França</td></tr><tr><td>406</td><td>Borguinhões</td><td>Suíça</td></tr><tr><td>406</td><td>Suevos</td><td>Portugal</td></tr><tr><td>408</td><td>Visigodos</td><td>Espanha</td></tr><tr><td>409</td><td>Anglo-saxões</td><td>Inglaterra</td></tr><tr><td>453</td><td>Lombardos</td><td>Itália</td></tr><tr><td>406</td><td>Vândalos</td><td>extintos</td></tr><tr><td>453</td><td>Ostrogodos</td><td>extintos</td></tr><tr><td>476</td><td>Hérulos</td><td>extintos</td></tr></table>"},
 {q:"Enquanto Daniel observava os dez chifres, o que mais ele percebeu?",
  v:[["Daniel 7:8, 20","dan 7:8-20"]],
  o:["Um 11º chifre grande e forte","Um 11º chifre pequeno e robusto","Uma ponta pequena que foi destruída pelos outros dez chifres"], c:1,
  h:"Daniel 7:8: entre os chifres subiu outro, pequeno, e diante dele três foram arrancados.",
  n:"Daniel vê surgir do quarto animal um 11º chifre, que ele chama de “chifre pequeno”. Apesar de pequeno, ele era mais robusto do que todos os outros dez. Daniel sente o desejo de conhecer mais sobre ele. O que esse chifre representa na profecia bíblica?"},
 {q:"Onde o chifre pequeno surgiria, e o que ele faria com três dos chifres?",
  v:[["Daniel 7:8, 20","dan 7:8-20"],["Daniel 7:24","dan 7:24"]],
  x:"<p><b>Identificando o chifre pequeno.</b> Uma leitura atenta do capítulo 7 mostra pelo menos dez características dele:</p><ol><li>Surgiria entre os dez chifres e depois deles (versos 8 e 24).</li><li>Arrancaria três chifres para se firmar (8, 20 e 24).</li><li>Teria olhos como de homem e uma boca que falava com insolência (8 e 20).</li><li>Pareceria mais robusto que os seus companheiros (20).</li><li>Faria guerra contra os santos e prevaleceria contra eles (21).</li><li>Proferiria palavras contra o Altíssimo (25).</li><li>Magoaria os santos do Altíssimo (25).</li><li>Cuidaria em mudar os tempos e a lei (25).</li><li>Os santos seriam entregues nas suas mãos por um tempo, dois tempos e metade de um tempo (25).</li><li>O seu domínio seria tirado por um tribunal, e ele seria destruído (26).</li></ol><p>Ao analisar esse poder na história, estudiosos como Isaac Newton e Martinho Lutero chegaram à mesma conclusão: o chifre pequeno representa a Roma papal. Vamos conferir, característica por característica.</p>",
  p:["Ele surgiria entre os ",["dez","=dez","=10"]," chifres e arrancaria ",["três","tres","=3"]," deles."],
  h:"Daniel 7:8: entre os chifres subiu outro, e diante dele três dos primeiros foram arrancados.",
  n:"Roma papal já operava antes da queda do império, em 476 d.C. (2 Tessalonicenses 2:7, 8). Só depois de arrancar três chifres, que correspondem a três tribos bárbaras arianas (hérulos, vândalos e ostrogodos), o papado pôde exercer o seu domínio. A última tribo a ser extinta foram os ostrogodos, em 538 d.C."},
 {q:"O chifre pequeno teria uma boca que falava com insolência e proferiria palavras contra o Altíssimo. O que a Bíblia chama de blasfêmia?",
  v:[["Daniel 7:8, 20","dan 7:8-20"],["Daniel 7:25","dan 7:25"],["João 10:33","jhn 10:33"],["Marcos 2:7","mar 2:7"]],
  s:"Marque V ou F em cada frase:",
  i:[["Pretender ser igual a Deus é blasfêmia.",1],["Pretender perdoar pecados é blasfêmia.",1],["O chifre pequeno falaria com respeito ao Altíssimo.",0]],
  h:"João 10:33 e Marcos 2:7 mostram dois sentidos de blasfêmia: fazer-se Deus e perdoar pecados.",
  n:"O chifre pequeno seria um poder blasfemo. Blasfêmia, na Bíblia, tem pelo menos dois sentidos: pretender ser igual a Deus e pretender perdoar pecados. Os dois casos são praticados pela Igreja Romana, ao oferecer perdão aos seus adeptos por meio do sacerdote (a confissão auricular) e ao afirmar que o Papa ocupa na Terra o lugar do Deus Altíssimo, como disse o Papa Leão XIII."},
 {q:"O chifre pequeno faria guerra contra os santos. Por quanto tempo eles seriam entregues nas suas mãos?",
  v:[["Daniel 7:21","dan 7:21"],["Daniel 7:25","dan 7:25"]],
  p:["Por 1.260 ",["anos","=anos","=ano"]," literais, de 538 d.C. até ",["1798","1798"]," d.C."],
  h:"Daniel 7:25: um tempo, dois tempos e metade de um tempo. Em profecia, um dia equivale a um ano.",
  n:"O poder do chifre pequeno perseguiu os fiéis filhos de Deus, os santos do Altíssimo, durante três tempos e meio: 42 meses de 30 dias, ou 1.260 dias proféticos, que são 1.260 anos literais. O mesmo período aparece em Apocalipse 11:3, 12:6, 14 e 13:5. Ele vai de 538 d.C. a 1798 d.C.",
  m:"Em 533 d.C., o imperador Justiniano reconheceu o bispo de Roma como cabeça de todas as igrejas. Mas só em 538, com a expulsão da última tribo inimiga do papado, os ostrogodos, o papa pôde exercer o poder temporal pleno. Contando 1.260 anos a partir de 538, chegamos a 1798. Em fevereiro daquele ano, o general francês Berthier, cumprindo ordem de Napoleão, prendeu o Papa Pio VI, que foi levado à França e morreu em 1799. Terminava assim a supremacia papal de 1.260 anos."},
 {q:"O chifre pequeno cuidaria em mudar “os tempos e a lei”. O que ele mudaria na lei de Deus?",
  v:[["Daniel 7:25","dan 7:25"],["Êxodo 20:4, 5","exo 20:4-5"]],
  s:"Marque V ou F em cada frase:",
  i:[["O segundo mandamento, que proíbe adorar imagens de escultura, foi retirado da fórmula do catecismo.",1],["O décimo mandamento foi dividido em dois, para que a lei continuasse com dez.",1],["O quinto mandamento foi retirado da lei.",0]],
  h:"Êxodo 20:4, 5 é o mandamento que proíbe imagens. Nos catecismos, ele não aparece na fórmula.",
  n:"A profecia fala de um ataque à lei de Deus. Duas mudanças: a exclusão do segundo mandamento, que proíbe fazer imagens de escultura e adorá-las, e a divisão do décimo em dois, “não desejar a mulher do próximo” e “não cobiçar as coisas alheias”, para que a lei não ficasse com nove mandamentos.",
  m:"A expressão “mudar os tempos” vem do aramaico zimnin, que indica um tempo fixo ou um período. Mudar os tempos é prerrogativa de Deus, pois só ele tem o destino das nações sob o seu controle (Daniel 2:21). O período de domínio de Nabucodonosor, Dario, Ciro, Alexandre e de outros foi determinado por Deus."},
 {q:"A terceira mudança envolve o quarto mandamento. Que dia Deus abençoou e santificou como memorial da criação?",
  v:[["Gênesis 2:1-3","gen 2:1-3"],["Apocalipse 14:7","rev 14:7"]],
  p:["Deus descansou no ",["sétimo","setim","=7"]," dia e o abençoou. Esse é o ",["sábado","sabado"],"."],
  h:"Gênesis 2:2, 3: Deus descansou no dia sétimo e o abençoou.",
  n:"O primeiro anjo de Apocalipse manda adorar aquele que fez o céu, a terra, o mar e as fontes das águas, e por isso Deus abençoou um dia em especial, o sétimo. O próprio Cristo santificava esse dia (Lucas 4:16, 31), disse que a sua lei não poderia ser mudada (Mateus 5:17, 18), e os discípulos continuaram a guardar o sábado depois da morte dele (Lucas 23:54-56; Atos 16:13; 17:2; 18:4).",
  m:"O sábado é um memorial da criação (Isaías 66:22, 23) e um sinal da relação de Deus com os seus filhos (Ezequiel 20:12). A mudança para o domingo foi um processo lento e gradual. A própria Igreja Romana admite que introduziu a adoração no domingo e diz ter o direito de fazê-lo, em celebração à ressurreição de Cristo. Jesus de fato ressuscitou no domingo, mas a Bíblia não diz, em parte alguma, que por isso o domingo deva ser santo. O Concílio de Laodiceia (cerca de 364 d.C.) orientou os cristãos a não “judaizar” no sábado e a honrar o domingo; e, em 1998, o Papa João Paulo II publicou a carta apostólica Dies Domini, que reafirma a devoção ao domingo. Hoje a santidade do domingo é a crença mais popular entre católicos e protestantes, embora a Bíblia não traga um único texto que a aprove."},
 {q:"Depois do período de supremacia papal, que cena Daniel viu?",
  v:[["Daniel 7:9, 10, 26","dan 7:9-26"]],
  p:["O Ancião de Dias se assentou, o ",["tribunal","tribunal","juizo"]," se assentou e os ",["livros","livro"]," foram abertos."],
  h:"Daniel 7:10: assentou-se o juízo, e abriram-se os livros.",
  n:"Depois do período de supremacia papal, Daniel viu no céu uma cena de juízo: milhares de milhares serviam ao Ancião de Dias e assistiam diante dele. Esse julgamento começou depois do fim dos 1.260 anos, ou seja, depois de 1798, e corresponde ao juízo pré-advento de Cristo. Quando ele terminar, o poder do chifre pequeno será tirado, e o reino será dado aos santos do Altíssimo, o que culminará na gloriosa Segunda Vinda de Jesus (Mateus 24:30; Apocalipse 1:7). Nos estudos 11 e 12 veremos a data exata em que ele começou."},

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tone(seq){ if(muted) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var t=ac.currentTime;
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type=n[2]||"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]);t+=n[1]+.06}); }catch(e){} }
var BAD=[[190,.18,"square"],[150,.3,"square"]], GOOD=[[660,.12],[880,.22]];

};
var BIBNAME = "Almeida (domínio público), adaptada para o português atual · confira na sua Bíblia em caso de dúvida";

function openBible(list,opener,start){
  bibList=list; bibFocus=opener||document.activeElement;
  var tabs=$("#mtabs");
  tabs.innerHTML = list.length>1 ? list.map(function(x,k){return '<button class="tab" data-k="'+k+'">'+esc(x[0])+'</button>'}).join("") : "";
  tabs.style.display = list.length>1 ? "flex" : "none";
  tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showRef(+b.dataset.k)}});
  $("#ov").classList.add("on"); $("#ov").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); bibOpen=true;
  try{history.pushState({bib:1},"")}catch(e){}
  showRef(start||0); $("#mx").focus();
}
function closeBible(fromPop){
  if(!bibOpen) return;
  bibOpen=false;
  $("#ov").classList.remove("on"); $("#ov").setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(!fromPop){ try{ if(history.state&&history.state.bib) history.back(); }catch(e){} }
  try{ bibFocus&&bibFocus.focus&&bibFocus.focus(); }catch(e){}
}
function showRef(k){
  var item=bibList[k], body=$("#mbody");
  document.querySelectorAll("#mtabs .tab").forEach(function(b,j){b.classList.toggle("sel",j===k)});
  body.scrollTop=0;
  var vs=BIB[item[1]], multi=vs&&vs.length>1;
  body.innerHTML = vs ? '<h2>'+esc(item[0])+'</h2>'+vs.map(function(v){return '<p class="vs">'+(multi?'<sup>'+v[0]+'</sup>':'')+esc(v[1])+'</p>'}).join("")+'<div class="ver">Tradução: '+esc(BIBNAME)+'</div>' : '<h2>'+esc(item[0])+'</h2><p>Texto não encontrado.</p>';
}
$("#mx").onclick=function(){closeBible()};
$("#mclose").onclick=function(){closeBible()};
$("#ov").addEventListener("click",function(e){ if(e.target===this) closeBible(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&bibOpen) closeBible(); });
window.addEventListener("popstate",function(){ if(bibOpen) closeBible(true); });

function render(){
  var i=st.i; tries=0; sel={};
  $("#back").style.visibility = i>0 ? "visible" : "hidden";
  $("#pb").style.width=(Math.max(i,0)/TOTAL*100)+"%";
  $("#cnt").textContent = i<0 ? "" : i<NQ ? "Pergunta "+(i+1)+" de "+NQ : i===NQ ? "Minha decisão" : "Estudo concluído";
  if(i<0){ app.innerHTML='<div class="card"><p class="q">Vamos começar</p><p class="intro">Você já teve uma ilusão de ótica? Parecia uma coisa, mas, olhando com mais atenção, era outra. Na vida, nem tudo o que parece é. Quando o assunto são as verdades eternas ensinadas na Palavra de Deus, precisamos estar convictos de que enxergamos as coisas como elas são. Neste estudo você vai enxergar verdades como realmente são. Pegue a sua Bíblia e ore para que o Espírito Santo ilumine a sua mente.</p><p class="mut">Tente responder cada pergunta. Se errar, é só tentar de novo: você só avança quando acertar. Se ficar difícil, leia o texto bíblico indicado ou peça ajuda ao seu instrutor.</p><button class="btn" id="go">Começar</button></div>'; $("#go").onclick=function(){st.i=0;save();render()}; return; }
  if(i<NQ) return question(Q[i],i);
  if(i===NQ){ app.innerHTML='<div class="card"><p class="q">Minha decisão</p><p>Se quiser, marque o que você deseja assumir:</p><label class="chk"><input type="checkbox"><span>Vou adorar somente a Deus, e não a “santos” ou imagens, pois eles nada podem fazer por mim (Isaías 42:8; 44:15).</span></label><label class="chk"><input type="checkbox"><span>Aceito Jesus como meu Advogado junto ao Pai e confio somente nele para o perdão dos meus pecados (1 Timóteo 2:5; 1 João 1:9; 2:1).</span></label><label class="chk"><input type="checkbox"><span>Aceito o sábado como o quarto mandamento da santa lei de Deus e decido, a partir de hoje, santificar esse dia em honra e glória ao Deus que tudo criou.</span></label><button class="btn" id="nx">Concluir o estudo</button></div>'; $("#nx").onclick=function(){st.i=NQ+1;save();render()}; return; }
  if(!st.d){st.d=1;save();}
  app.innerHTML='<div class="card"><p class="q">Parabéns! Você concluiu o Estudo 9.</p><p>Próximo estudo: <b>Um carneiro e um bode</b>. Quando o seu instrutor passar o código na aula, digite aqui para liberar.</p><div class="tc"><input id="nc" placeholder="Código do próximo estudo" autocomplete="off" autocapitalize="characters"><button class="btn sec" id="nok" style="margin:0">Liberar</button></div><div id="nm"></div><a class="btn sec" href="../estudos/">Voltar à lista de estudos</a></div>';
  function lib(){ var d=$("#nc").value.trim().toUpperCase(); if(!d) return; if(d===NEXT_CODE){ st.u=1; save(); tone(GOOD); $("#nm").innerHTML='<div class="msg ok">Estudo 10 liberado!</div><a class="btn" href="../estudo-10/">Ir para o Estudo 10</a>'; } else { tone(BAD); $("#nm").innerHTML='<div class="msg no">Código incorreto. Peça ao seu instrutor.</div>'; } }
  $("#nok").onclick=lib; $("#nc").addEventListener("keydown",function(e){if(e.key==="Enter")lib()});
  if(st.u) $("#nm").innerHTML='<div class="msg ok">Estudo 10 liberado!</div><a class="btn" href="../estudo-10/">Ir para o Estudo 10</a>';
}

function question(q,i){
  var h='<div class="card" id="c"><div class="q">'+(i+1)+". "+q.q+'</div>';
  if(q.v) h+='<div class="ref">📖 '+q.v.map(function(x,k){return '<button class="refbtn" data-k="'+k+'">'+esc(x[0])+'</button>'}).join(" · ")+' <span class="mut">· toque para ler</span></div>'; else h+='<div class="ref"></div>';
  if(q.x) h+='<div class="read">'+q.x+'</div>';
  var parts={
    p:function(){ var k=0; return '<p class="s">'+q.p.map(function(x){return typeof x==="string"?x:'<input class="b" data-k="'+(k++)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta '+k+'">'}).join("")+'</p>'; },
    i:function(){ return (q.s?'<p class="sub">'+q.s+'</p>':'')+q.i.map(function(x,k){return '<div class="row"><span>'+x[0]+'</span><span class="vf" data-k="'+k+'"><button data-v="1" aria-label="Verdadeiro">V</button><button data-v="0" aria-label="Falso">F</button></span></div>'}).join(""); },
    o:function(){ return q.o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x+'</button>'}).join(""); },
    w:function(){ return '<textarea class="wt" id="wt" rows="3" maxlength="300" placeholder="Escreva aqui, com suas palavras"></textarea>'; }
  };
  "poiw".split("").forEach(function(c){ if(q[c]) h+=parts[c](); });
  h+='<div id="fb"></div><button class="btn" id="ck">Verificar</button></div>';
  app.innerHTML=h;
  document.querySelectorAll(".refbtn").forEach(function(b){b.onclick=function(){openBible(q.v,b,+b.dataset.k)}});
  document.querySelectorAll(".vf button").forEach(function(b){b.onclick=function(){var p=b.parentNode;p.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel[p.dataset.k]=+b.dataset.v}});
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel.c=+b.dataset.k}});
  $("#ck").onclick=function(){check(q,i)};
  document.querySelectorAll("input.b").forEach(function(f){f.addEventListener("keydown",function(e){if(e.key==="Enter")check(q,i)})});
  var sa=st.a&&st.a[i]; if(sa){ putAns(q,sa); check(q,i,true); }
}

function canonAns(q){ var a={}; if(q.p) a.f=q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ a.v[k]=x[1]; }); } if(q.o) a.c=q.c; if(q.w) a.f=[q.rf]; return a; }
function readAns(q){ var a={}; if(q.p) a.f=[].map.call(document.querySelectorAll("input.b"),function(x){return x.value}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ if(sel[k]!==undefined) a.v[k]=sel[k]; }); } if(q.o&&sel.c!==undefined) a.c=sel.c; if(q.w) a.f=[$("#wt").value.trim()]; return a; }
function putAns(q,a){
  if(a.f) [].forEach.call(document.querySelectorAll("input.b"),function(x,k){ x.value=a.f[k]||""; });
  if(a.v) Object.keys(a.v).forEach(function(k){ sel[k]=a.v[k]; var g=document.querySelector('.vf[data-k="'+k+'"]'); if(g) g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("sel",+b.dataset.v===a.v[k]); }); });
  if(a.c!==undefined){ sel.c=a.c; document.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel",+b.dataset.k===a.c); }); }
  if(q.w&&a.f&&$("#wt")) $("#wt").value=a.f[0]||"";
}
function answerText(q){
  var a=[];
  if(q.p) a.push(q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}).join(" · "));
  if(q.i) a.push(q.i.map(function(x){return (x[1]?"V":"F")}).join(" · "));
  if(q.o) a.push(q.o[q.c]);
  if(q.w) a.push(q.rf);
  return a.join(" | ");
}
function check(q,i,silent){
  var ok=true, fb=$("#fb"), card=$("#c");
  if(q.p){ var k=0; q.p.forEach(function(x){ if(typeof x==="string")return; var inp=document.querySelector('input[data-k="'+(k++)+'"]'); var v=norm(inp.value); var good=!!v&&accepted(x).some(function(a){return match(v,a)}); inp.classList.toggle("ok",good); inp.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.i){ q.i.forEach(function(x,k){ var g=document.querySelector('.vf[data-k="'+k+'"]'); var good=sel[k]===x[1]; g.classList.toggle("ok",good); g.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.o){ document.querySelectorAll(".opt").forEach(function(b){b.classList.remove("ok","no")}); var b=document.querySelector('.opt[data-k="'+sel.c+'"]'); if(sel.c===undefined) ok=false; else { b.classList.add(sel.c===q.c?"ok":"no"); if(sel.c!==q.c) ok=false; } }
  if(q.w){ var wt=$("#wt"), good=wt.value.trim().length>=8; wt.classList.toggle("ok",good); wt.classList.toggle("no",!good); if(!good) ok=false; }
  if(ok) return acerto(q,i,silent);
  if(silent) return;
  tries++; tone(BAD); try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  var m='<div class="msg no">'+(q.w?'Escreva ao menos uma frase curta, com suas palavras.':'Ainda não. Releia o texto e tente de novo.')+'</div>';
  if(tries>=2) m+='<div class="hint">💡 Dica: '+q.h+'</div>';
  if(tries>=3) m+='<button class="btn sec" id="ti">Chamar o instrutor</button><div id="tb"></div>';
  fb.innerHTML=m;
  if(tries>=3) $("#ti").onclick=function(){ $("#tb").innerHTML='<div class="tc"><input id="tcd" type="password" placeholder="Código do instrutor"><button class="btn sec" id="tok" style="margin:0">OK</button></div><div id="tr"></div>'; $("#tok").onclick=function(){ if($("#tcd").value===TEACHER_CODE){ $("#tr").innerHTML='<div class="note">Resposta: '+answerText(q)+'</div><button class="btn" id="sk">Seguir adiante</button>'; $("#sk").onclick=function(){ st.a=st.a||{}; st.a[i]=canonAns(q); avancar(); }; } else {$("#tr").innerHTML='<div class="msg no">Código incorreto.</div>';tone(BAD)} } };
}
function acerto(q,i,silent){
  if(!silent){ st.a=st.a||{}; st.a[i]=readAns(q); save(); tone(GOOD); }
  document.querySelectorAll("input.b,.opt,.vf button,.wt").forEach(function(x){x.disabled=true});
  var h='<div class="msg ok">Muito bem! ✔</div>'+(q.rf?'<div class="note"><b>Resposta de referência:</b> '+q.rf+'</div>':'')+(q.n?'<div class="note">'+q.n+'</div>':'')+(q.m?'<details class="det"><summary>Saiba mais</summary><p>'+q.m+'</p></details>':'')+'<button class="btn" id="nx">'+(i===NQ-1?"Continuar":"Próxima pergunta")+'</button>';
  $("#fb").innerHTML=h; $("#ck").style.display="none"; $("#nx").onclick=avancar; if(!silent) $("#nx").focus();
}
function avancar(){ st.i++; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function voltar(){ if(st.i<=0) return; closeBible(); st.i--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#back").onclick=voltar;
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇 Som desligado":"🔊 Som ligado"};
$("#reset").onclick=function(){ st={i:-1,u:0}; save(); render(); };
render();
</script>
