.tabs{display:flex;gap:8px;padding:0 20px 8px;overflow-x:auto}
.tab{flex:none;font:inherit;font-weight:700;font-size:15px;color:var(--teal);background:transparent;border:2px solid var(--teal);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab.sel{background:var(--teal);color:#fff}
.mb{padding:6px 20px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:120px}
.mb h2{font:700 24px/1.2 Georgia,serif;color:var(--qc);margin:4px 0 12px}
.vs{font:20px/1.75 Georgia,serif;margin:0 0 10px}
.vs sup{font:700 12px Calibri,system-ui,sans-serif;color:var(--or);margin-right:3px}
.ver{font-size:13px;color:var(--mut);margin-top:12px}
.mf{padding:6px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.mf .btn{width:100%;margin-top:6px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:24px;max-height:80vh}.mf{padding-bottom:18px}}
@media (prefers-reduced-motion:reduce){.shake,.md,.ov.on{animation:none}.bar i{transition:none}}
</style>

<div class="wrap">

<script>
// ====== CONFIGURAÇÃO ======
var TEACHER_CODE = "K3D7";   // código do instrutor (mostra a resposta)
var NEXT_CODE = "DPC2";      // código que libera o Estudo 2 (Dois Poderes em Conflito)
var KEY = "didaque_e101_v1";  // progresso deste estudo (série Daniel: ids 101, 102...)

// Tipos: p = completar | i = V/F | o = múltipla escolha | w = escrever uma frase
// n = texto de apoio | m = "Saiba mais" (abre e fecha) | r = resposta de referência (tipo w)
var Q = [
 {q:"Segundo Jesus, quem escreveu o livro de Daniel?",
  v:[["Mateus 24:15","mat 24:15"]],
  p:["Jesus falou da “abominação da desolação”, de que falou o profeta ",["Daniel","daniel"],"."],
  h:"Mateus 24:15 diz: “de que falou o profeta ...”.",
  n:"Se o próprio Jesus reconheceu Daniel como o autor, não há razão para duvidar.",
  m:"O livro foi escrito por volta de 600 a.C., quando Daniel era prisioneiro na Babilônia. Ele escreve na primeira pessoa e mostra conhecer detalhes do século VI a.C. Essas pistas reforçam o que Jesus disse."},
 {q:"Quem era Daniel?",
  v:[["Daniel 1:3-6","dan 1:3-6"]],
  s:"Marque V ou F em cada frase:",
  i:[["Daniel era um jovem israelita levado cativo para a Babilônia.",1],["Daniel era de família real ou da nobreza de Israel.",1],["Daniel tinha um defeito físico.",0],["Daniel era instruído em toda a sabedoria.",1]],
  h:"Daniel 1:4 fala de jovens sem nenhum defeito, de boa aparência e instruídos.",

  p:["Deus mostrou o que vai acontecer nos ",["últimos","ultimos"]," dias."],
  h:"Os dois textos falam do que vai acontecer nos ... dias.",
  n:"Parte do livro fala de dias ainda distantes para Daniel, o período que a Bíblia chama de “últimos dias”. Essas profecias pedem atenção especial, porque se destinam ao tempo em que vivemos.",
  m:"A Bíblia usa a expressão “últimos dias” também em 2 Timóteo 3:1 e 2 Pedro 3:3."},
 {q:"Que ordem Daniel recebeu do anjo? Responda com poucas palavras.",
  v:[["Daniel 12:4, 9","dan 12:4,9"]], w:1,
  rf:"Fechar as palavras e selar o livro até o tempo do fim.",
  h:"Leia o versículo 4 e escreva com suas palavras.",
  n:"Essas profecias ficariam seladas até o tempo determinado. Então, com um estudo diligente do livro, os mistérios seriam compreendidos."},
 {q:"Quando começaria o “tempo do fim”, em que os mistérios do livro poderiam ser compreendidos?",
  v:[["Daniel 12:6, 7","dan 12:6-7"]],

 {q:"Nas profecias, quanto tempo representa um dia?",
  v:[["Números 14:34","num 14:34"],["Ezequiel 4:6","eze 4:6"]],
  p:["Na profecia, cada dia representa um ",["ano","=ano","=anos"]," literal."],
  h:"Números 14:34: “cada dia representará um ...”.",
  n:"É o princípio dia-ano. Por isso 42 meses de 30 dias somam 1.260 dias proféticos, ou seja, 1.260 anos.",
  m:"Esse mesmo período aparece em Daniel 7:25 e em Apocalipse 11:3, 12:6 e 13:5. Nos próximos estudos veremos quando ele começou e terminou: de 538 d.C. a 1798 d.C., ano que marca o início do “tempo do fim”."},
 {q:"Que segurança a Bíblia nos dá quanto ao futuro? Responda em uma frase.",
  v:[["Amós 3:7","amo 3:7"]], w:1,
  rf:"Deus não faz nada sem antes revelar o seu segredo aos seus servos, os profetas.",
  h:"Leia Amós 3:7 e escreva com suas palavras.",
  n:"Daniel foi chamado por Deus para receber revelações que se aplicam de modo especial aos nossos dias. Por isso vale reservar tempo para estudar esse livro."},
 {q:"O que acontece quando se rejeita a mensagem profética?",
  v:[["Provérbios 29:18","pro 29:18"]],
  p:["Não havendo profecia, o povo se ",["corrompe","corromp"],"."],
  h:"Provérbios 29:18: “Não havendo profecia, o povo se ...”.",
  n:"Quem despreza a mensagem profética perde o padrão moral de Deus, e sem Deus o ser humano se corrompe. A profecia mostra que podemos confiar em Deus quanto ao presente e ao futuro."},
 {q:"Que advertência Jesus deu ao falar de uma profecia de Daniel?",

var NQ = Q.length, TOTAL = NQ + 2;
var $ = function(s){return document.querySelector(s)}, app = $("#app");
var st = {i:-1,u:0}; try{var sv=JSON.parse(localStorage.getItem(KEY)); if(sv) st=sv;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var muted=false, tries=0, sel={}, ac;

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function match(v,a){ if(a.charAt(0)==="=") return (" "+v+" ").indexOf(" "+norm(a.slice(1))+" ")>-1; return v.indexOf(norm(a))>-1; }
function accepted(x){ return x.length>1 ? x.slice(1) : x; }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tone(seq){ if(muted) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var t=ac.currentTime;
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type=n[2]||"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]);t+=n[1]+.06}); }catch(e){} }
var BAD=[[190,.18,"square"],[150,.3,"square"]], GOOD=[[660,.12],[880,.22]];

/* ===== Pop-up bíblico ===== */
var bibOpen=false, bibList=[], bibFocus=null;
// Textos adaptados do Almeida (domínio público) para o português atual
var BIB = {
 "mat 24:15": [[15, "Quando vocês virem no lugar santo a abominação da desolação, de que falou o profeta Daniel (quem lê, entenda),"]],
 "dan 1:3-6": [[3, "O rei disse a Aspenaz, chefe dos seus oficiais, que trouxesse alguns dos filhos de Israel, tanto da família real como da nobreza,"],[4, "jovens sem nenhum defeito, de boa aparência, instruídos em toda a sabedoria, cheios de conhecimento e de bom entendimento, capazes de servir no palácio do rei; e que lhes ensinasse a escrita e a língua dos caldeus."],[5, "O rei determinou para eles uma ração diária, das finas iguarias do rei e do vinho que ele bebia, e que fossem mantidos assim por três anos, para que, no fim desse tempo, estivessem prontos para servir diante do rei."],[6, "Entre eles estavam, dos filhos de Judá, Daniel, Hananias, Misael e Azarias."]],
 "dan 2:28": [[28, "Mas há um Deus no céu, que revela os segredos e fez saber ao rei Nabucodonosor o que vai acontecer nos últimos dias. O seu sonho e as visões que o senhor teve na cama foram estes:"]],
 "dan 10:14": [[14, "Agora vim para fazer você entender o que vai acontecer ao seu povo nos últimos dias, porque a visão se refere a dias ainda distantes."]],
 "dan 12:4,9": [[4, "Mas você, Daniel, feche estas palavras e sele o livro até o tempo do fim; muitos correrão de um lado para outro, e o conhecimento aumentará."],[9, "Ele respondeu: Vá, Daniel, porque estas palavras estão fechadas e seladas até o tempo do fim."]],
 "dan 12:6-7": [[6, "Um deles perguntou ao homem vestido de linho, que estava sobre as águas do rio: Quando será o fim dessas maravilhas?"],[7, "Então ouvi o homem vestido de linho, que estava sobre as águas do rio, levantar a mão direita e a esquerda para o céu e jurar por aquele que vive para sempre que isso seria depois de um tempo, dois tempos e metade de um tempo; e que, quando terminasse o esmagamento do poder do povo santo, todas essas coisas se cumpririam."]],
 "num 14:34": [[34, "Segundo o número dos dias em que vocês espiaram a terra, quarenta dias, cada dia representará um ano; vocês carregarão a culpa dos seus pecados por quarenta anos e saberão o que é ter-me contra vocês."]],
 "eze 4:6": [[6, "Quando você terminar esses dias, deite-se sobre o lado direito e carregue a culpa da casa de Judá por quarenta dias; eu lhe dei um dia para cada ano."]],
 "amo 3:7": [[7, "Certamente o Senhor Deus não fará coisa alguma sem antes revelar o seu segredo aos seus servos, os profetas."]],
 "pro 29:18": [[18, "Não havendo profecia, o povo se corrompe; mas feliz é quem guarda a lei."]]
};
var BIBNAME = "Almeida (domínio público), adaptada para o português atual · confira na sua Bíblia em caso de dúvida";

function openBible(list,opener,start){
  bibList=list; bibFocus=opener||document.activeElement;
  var tabs=$("#mtabs");
  tabs.innerHTML = list.length>1 ? list.map(function(x,k){return '<button class="tab" data-k="'+k+'">'+esc(x[0])+'</button>'}).join("") : "";
  tabs.style.display = list.length>1 ? "flex" : "none";
  tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showRef(+b.dataset.k)}});
  $("#ov").classList.add("on"); $("#ov").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); bibOpen=true;
  try{history.pushState({bib:1},"")}catch(e){}
  showRef(start||0); $("#mx").focus();
}
function closeBible(fromPop){
  if(!bibOpen) return;
  bibOpen=false;
  $("#ov").classList.remove("on"); $("#ov").setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(!fromPop){ try{ if(history.state&&history.state.bib) history.back(); }catch(e){} }
  try{ bibFocus&&bibFocus.focus&&bibFocus.focus(); }catch(e){}
}
function showRef(k){
  var item=bibList[k], body=$("#mbody");
  document.querySelectorAll("#mtabs .tab").forEach(function(b,j){b.classList.toggle("sel",j===k)});
  body.scrollTop=0;
  var vs=BIB[item[1]], multi=vs&&vs.length>1;
  body.innerHTML = vs ? '<h2>'+esc(item[0])+'</h2>'+vs.map(function(v){return '<p class="vs">'+(multi?'<sup>'+v[0]+'</sup>':'')+esc(v[1])+'</p>'}).join("")+'<div class="ver">Tradução: '+esc(BIBNAME)+'</div>' : '<h2>'+esc(item[0])+'</h2><p>Texto não encontrado.</p>';
}
$("#mx").onclick=function(){closeBible()};
$("#mclose").onclick=function(){closeBible()};
$("#ov").addEventListener("click",function(e){ if(e.target===this) closeBible(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&bibOpen) closeBible(); });
window.addEventListener("popstate",function(){ if(bibOpen) closeBible(true); });

function render(){
  var i=st.i; tries=0; sel={};
  $("#back").style.visibility = i>0 ? "visible" : "hidden";
  $("#pb").style.width=(Math.max(i,0)/TOTAL*100)+"%";
  $("#cnt").textContent = i<0 ? "" : i<NQ ? "Pergunta "+(i+1)+" de "+NQ : i===NQ ? "Minha decisão" : "Estudo concluído";
  if(i<0){ app.innerHTML='<div class="card"><p class="q">Vamos começar</p><p class="intro">Durante séculos a Bíblia foi proibida e censurada, e muita gente perdeu a vida por acreditar no que ela ensina. Hoje temos liberdade para estudá-la, e isso é um privilégio. Antes de começar, faça uma oração pedindo que o mesmo Espírito que inspirou os profetas ilumine a sua mente.</p><p class="mut">Tente responder cada pergunta. Se errar, é só tentar de novo: você só avança quando acertar. Se ficar difícil, leia o texto bíblico indicado ou peça ajuda ao seu instrutor.</p><details class="det"><summary>Saiba mais: como a Bíblia é organizada</summary><p>A Bíblia tem 66 livros em dois Testamentos. No Antigo: Pentateuco (Gênesis a Deuteronômio), livros históricos (Josué a Ester), poéticos (Jó a Cantares) e proféticos (Isaías a Malaquias, com Daniel entre os profetas maiores). No Novo: Evangelhos, Atos, Epístolas (cartas) e o livro profético de Apocalipse. Daniel e Apocalipse têm mensagens específicas para os nossos dias.</p></details><button class="btn" id="go">Começar</button></div>'; $("#go").onclick=function(){st.i=0;save();render()}; return; }
  if(i<NQ) return question(Q[i],i);
  if(i===NQ){ app.innerHTML='<div class="card"><p class="q">Minha decisão</p><p>Se quiser, marque o que você deseja assumir:</p><label class="chk"><input type="checkbox"><span>Vou fazer uma oração de gratidão a Deus pela oportunidade de conhecer mais da Sua Palavra.</span></label><label class="chk"><input type="checkbox"><span>Vou dedicar tempo todos os dias à leitura da Bíblia.</span></label><label class="chk"><input type="checkbox"><span>Vou buscar a ajuda de Deus para praticar o que aprender.</span></label><button class="btn" id="nx">Concluir o estudo</button></div>'; $("#nx").onclick=function(){st.i=NQ+1;save();render()}; return; }
  if(!st.d){st.d=1;save();}
  app.innerHTML='<div class="card"><p class="q">Parabéns! Você concluiu o Estudo 1.</p><p>Próximo estudo: <b>Dois poderes em conflito</b>. Quando o seu instrutor passar o código na aula, digite aqui para liberar.</p><div class="tc"><input id="nc" placeholder="Código do próximo estudo" autocomplete="off" autocapitalize="characters"><button class="btn sec" id="nok" style="margin:0">Liberar</button></div><div id="nm"></div><a class="btn sec" href="../../">Voltar ao início</a></div>';
  function lib(){ var d=$("#nc").value.trim().toUpperCase(); if(!d) return; if(d===NEXT_CODE){ st.u=1; save(); tone(GOOD); $("#nm").innerHTML='<div class="msg ok">Estudo 2 liberado!</div><a class="btn" href="../estudo-2/">Ir para o Estudo 2</a>'; } else { tone(BAD); $("#nm").innerHTML='<div class="msg no">Código incorreto. Peça ao seu instrutor.</div>'; } }
  $("#nok").onclick=lib; $("#nc").addEventListener("keydown",function(e){if(e.key==="Enter")lib()});
  if(st.u) $("#nm").innerHTML='<div class="msg ok">Estudo 2 liberado!</div><a class="btn" href="../estudo-2/">Ir para o Estudo 2</a>';
}

function question(q,i){
  var h='<div class="card" id="c"><div class="q">'+(i+1)+". "+q.q+'</div>';
  if(q.v) h+='<div class="ref">📖 '+q.v.map(function(x,k){return '<button class="refbtn" data-k="'+k+'">'+esc(x[0])+'</button>'}).join(" · ")+' <span class="mut">· toque para ler</span></div>'; else h+='<div class="ref"></div>';
  var parts={
    p:function(){ var k=0; return '<p class="s">'+q.p.map(function(x){return typeof x==="string"?x:'<input class="b" data-k="'+(k++)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta '+k+'">'}).join("")+'</p>'; },
    i:function(){ return (q.s?'<p class="sub">'+q.s+'</p>':'')+q.i.map(function(x,k){return '<div class="row"><span>'+x[0]+'</span><span class="vf" data-k="'+k+'"><button data-v="1" aria-label="Verdadeiro">V</button><button data-v="0" aria-label="Falso">F</button></span></div>'}).join(""); },
    o:function(){ return q.o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x+'</button>'}).join(""); },
    w:function(){ return '<textarea class="wt" id="wt" rows="3" maxlength="300" placeholder="Escreva aqui, com suas palavras"></textarea>'; }
  };
  "poiw".split("").forEach(function(c){ if(q[c]) h+=parts[c](); });
  h+='<div id="fb"></div><button class="btn" id="ck">Verificar</button></div>';
  app.innerHTML=h;
  document.querySelectorAll(".refbtn").forEach(function(b){b.onclick=function(){openBible(q.v,b,+b.dataset.k)}});
  document.querySelectorAll(".vf button").forEach(function(b){b.onclick=function(){var p=b.parentNode;p.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel[p.dataset.k]=+b.dataset.v}});
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel.c=+b.dataset.k}});
  $("#ck").onclick=function(){check(q,i)};
  document.querySelectorAll("input.b").forEach(function(f){f.addEventListener("keydown",function(e){if(e.key==="Enter")check(q,i)})});
  var sa=st.a&&st.a[i]; if(sa){ putAns(q,sa); check(q,i,true); }
}

function canonAns(q){ var a={}; if(q.p) a.f=q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ a.v[k]=x[1]; }); } if(q.o) a.c=q.c; if(q.w) a.f=[q.rf]; return a; }
function readAns(q){ var a={}; if(q.p) a.f=[].map.call(document.querySelectorAll("input.b"),function(x){return x.value}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ if(sel[k]!==undefined) a.v[k]=sel[k]; }); } if(q.o&&sel.c!==undefined) a.c=sel.c; if(q.w) a.f=[$("#wt").value.trim()]; return a; }
function putAns(q,a){
  if(a.f) [].forEach.call(document.querySelectorAll("input.b"),function(x,k){ x.value=a.f[k]||""; });
  if(a.v) Object.keys(a.v).forEach(function(k){ sel[k]=a.v[k]; var g=document.querySelector('.vf[data-k="'+k+'"]'); if(g) g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("sel",+b.dataset.v===a.v[k]); }); });
  if(a.c!==undefined){ sel.c=a.c; document.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel",+b.dataset.k===a.c); }); }
  if(q.w&&a.f&&$("#wt")) $("#wt").value=a.f[0]||"";
}
function answerText(q){
  var a=[];
  if(q.p) a.push(q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}).join(" · "));
  if(q.i) a.push(q.i.map(function(x){return (x[1]?"V":"F")}).join(" · "));
  if(q.o) a.push(q.o[q.c]);
  if(q.w) a.push(q.rf);
  return a.join(" | ");
}
function check(q,i,silent){
  var ok=true, fb=$("#fb"), card=$("#c");
  if(q.p){ var k=0; q.p.forEach(function(x){ if(typeof x==="string")return; var inp=document.querySelector('input[data-k="'+(k++)+'"]'); var v=norm(inp.value); var good=!!v&&accepted(x).some(function(a){return match(v,a)}); inp.classList.toggle("ok",good); inp.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.i){ q.i.forEach(function(x,k){ var g=document.querySelector('.vf[data-k="'+k+'"]'); var good=sel[k]===x[1]; g.classList.toggle("ok",good); g.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.o){ document.querySelectorAll(".opt").forEach(function(b){b.classList.remove("ok","no")}); var b=document.querySelector('.opt[data-k="'+sel.c+'"]'); if(sel.c===undefined) ok=false; else { b.classList.add(sel.c===q.c?"ok":"no"); if(sel.c!==q.c) ok=false; } }
  if(q.w){ var wt=$("#wt"), good=wt.value.trim().length>=8; wt.classList.toggle("ok",good); wt.classList.toggle("no",!good); if(!good) ok=false; }
  if(ok) return acerto(q,i,silent);
  if(silent) return;
  tries++; tone(BAD); try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  var m='<div class="msg no">'+(q.w?'Escreva ao menos uma frase curta, com suas palavras.':'Ainda não. Releia o texto e tente de novo.')+'</div>';
  if(tries>=2) m+='<div class="hint">💡 Dica: '+q.h+'</div>';
  if(tries>=3) m+='<button class="btn sec" id="ti">Chamar o instrutor</button><div id="tb"></div>';
  fb.innerHTML=m;
  if(tries>=3) $("#ti").onclick=function(){ $("#tb").innerHTML='<div class="tc"><input id="tcd" type="password" placeholder="Código do instrutor"><button class="btn sec" id="tok" style="margin:0">OK</button></div><div id="tr"></div>'; $("#tok").onclick=function(){ if($("#tcd").value===TEACHER_CODE){ $("#tr").innerHTML='<div class="note">Resposta: '+answerText(q)+'</div><button class="btn" id="sk">Seguir adiante</button>'; $("#sk").onclick=function(){ st.a=st.a||{}; st.a[i]=canonAns(q); avancar(); }; } else {$("#tr").innerHTML='<div class="msg no">Código incorreto.</div>';tone(BAD)} } };
}
function acerto(q,i,silent){
  if(!silent){ st.a=st.a||{}; st.a[i]=readAns(q); save(); tone(GOOD); }
  document.querySelectorAll("input.b,.opt,.vf button,.wt").forEach(function(x){x.disabled=true});
  var h='<div class="msg ok">Muito bem! ✔</div>'+(q.rf?'<div class="note"><b>Resposta de referência:</b> '+q.rf+'</div>':'')+(q.n?'<div class="note">'+q.n+'</div>':'')+(q.m?'<details class="det"><summary>Saiba mais</summary><p>'+q.m+'</p></details>':'')+'<button class="btn" id="nx">'+(i===NQ-1?"Continuar":"Próxima pergunta")+'</button>';
  $("#fb").innerHTML=h; $("#ck").style.display="none"; $("#nx").onclick=avancar; if(!silent) $("#nx").focus();
}
function avancar(){ st.i++; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function voltar(){ if(st.i<=0) return; closeBible(); st.i--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#back").onclick=voltar;
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇 Som desligado":"🔊 Som ligado"};
$("#reset").onclick=function(){ st={i:-1,u:0}; save(); render(); };
render();
</script>
